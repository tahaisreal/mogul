      const baseX = k === 0 ? -1.5 : 1.5;
      tween(760, (p) => {
        const e = 1 - Math.pow(1 - p, 3);
        m.rotation.x = from.x + (target[0] + spinX - from.x) * e;
        m.rotation.y = from.y + (target[1] - from.y) * e;
        m.rotation.z = from.z + (target[2] + spinZ - from.z) * e;
        m.position.y = TOP + 0.6 + Math.sin(p * Math.PI) * 2.6;
        m.position.x = baseX + (1 - e) * (k === 0 ? -2 : 2);
      }, () => {
        m.rotation.set(target[0], target[1], target[2]);
        m.position.set(baseX, TOP + 0.6, 0);
      });
    });
  };

  /* ---------------- focus / highlight ---------------- */

  let focusP = null, focusG = null;
  api.focus = function (playerId, group) {
    focusP = playerId; focusG = group;
    if (!overlays.length) return;
    const on = !!(playerId || group);
    for (let i = 0; i < 40; i++) {
      const m = overlays[i], t = BOARD[i], o = S.owned[i];
      let hit = false;
      if (playerId && o && o.by === playerId) hit = true;
      if (group && t.group === group) hit = true;
      if (!on) { m.material.opacity = 0; continue; }
      if (hit) {
        m.material.color.set(playerId ? Engine.P(S, playerId).color : (GROUPS[group] ? GROUPS[group].color : '#ffffff'));
        m.material.opacity = 0.34;
        continue;
      }
      // Shading the rest only makes sense when picking one player's holdings
      // out of the whole board; for a country the highlight alone is enough.
      if (playerId) { m.material.color.set('#000000'); m.material.opacity = 0.62; }
      else m.material.opacity = 0;
    }
  };

  let hoverTile = -1;
  function setHover(i) {
    if (i === hoverTile) return;
    hoverTile = i;
    if (!focusP && !focusG && overlays.length) {
      overlays.forEach((m, k) => {
        m.material.color.set('#ffffff');
        m.material.opacity = k === i ? 0.16 : 0;
      });
    }
    if (api.onHover) api.onHover(i);
  }

  /* ---------------- camera + input ---------------- */

  /* Distance is derived from the viewport shape so the whole board is always
     in frame, on a wide monitor and on a phone alike. */
  function frameCamera() {
    if (!camera) return;
    const half = Math.tan((cam.fov * Math.PI / 180) / 2);
    const boardW = B * 1.06;
    const boardH = B * Math.sin(cam.el) + THICK * 2;
    // only part of the frustum is actually painted once the bar is reserved
    const needV = (boardH / 2) / (half * cam.vFrac);
    const needH = (boardW / 2) / (half * Math.max(0.35, camera.aspect));
    cam.dist = Math.max(needV, needH) * 1.1 * cam.zoom;
    applyCamera();
  }

  function applyCamera() {
    const { az, el, dist } = cam;
    camera.position.set(
      Math.cos(az) * Math.cos(el) * dist,
      Math.sin(el) * dist,
      Math.sin(az) * Math.cos(el) * dist);
    camera.lookAt(0, 0, 0);
  }

  api.resetView = function () { cam.zoom = 1; frameCamera(); };

  function bindInput(dom) {
    dom.addEventListener('pointermove', pick);
    dom.addEventListener('pointerleave', () => setHover(-1));
    dom.addEventListener('click', () => {
      if (hoverTile >= 0 && api.onClick) api.onClick(hoverTile);
    });
    // a small zoom range only — never enough to break the framing
    dom.addEventListener('wheel', (e) => {
      e.preventDefault();
      cam.zoom = Math.max(0.82, Math.min(1.2, cam.zoom + Math.sign(e.deltaY) * 0.05));
      frameCamera();
    }, { passive: false });
  }

  let ray = null, ndc = null;
  function pick(e) {
    if (!ray) { ray = new THREE.Raycaster(); ndc = new THREE.Vector2(); }
    const r = renderer.domElement.getBoundingClientRect();
    ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
    ndc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObject(pickPlane, false)[0];
    if (!hit) return setHover(-1);
    setHover(Layout.fromPoint(hit.point.x, hit.point.z));
    api.lastPointer = { x: e.clientX, y: e.clientY };
  }

  /* ---------------- lifecycle ---------------- */

  api.Layout = Layout;
  // exposed for headless verification of the scene graph
  api._build = buildScene;
  api._pawn = pawnMesh;
  api._paint = drawTexture;
  api._sync = () => { syncPawns(); syncBuildings(); };
  api._pawns = () => pawns;
  api._overlays = () => overlays;
  api._spot = pawnSpot;
  api.ready = false;
  api.error = () => loadError;

  api.mount = async function (host) {
    if (api.ready) return true;
    container = host;
    try {
      const T = await import('https://unpkg.com/three@0.185.1/build/three.module.js');
      await loadFlags();
      renderer = new T.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = T.PCFSoftShadowMap;
      renderer.toneMapping = T.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.18;
      host.appendChild(renderer.domElement);
      renderer.domElement.style.cssText = 'width:100%;height:100%;display:block;border-radius:16px;touch-action:none;cursor:default';

      buildScene(T);
      drawTexture();
      syncPawns();
      syncBuildings();
      frameCamera();
      bindInput(renderer.domElement);
      resize();
      window.addEventListener('resize', resize);

      const loop = (now) => {
        raf = requestAnimationFrame(loop);
        stepTweens(now);
        // gentle bob on the active player's pawn
        const cur = Engine.current(S);
        Object.entries(pawns).forEach(([id, g]) => {
          const isCur = cur && cur.id === id && S.phase === 'playing';
          const b = g.userData.body;
          if (b) b.position.y = g.userData.baseY + (isCur && !g.userData.walking ? Math.sin(now / 280) * 0.07 + 0.07 : 0);
        });
        renderer.render(scene, camera);
      };
      raf = requestAnimationFrame(loop);
      api.ready = true;
      return true;
    } catch (e) {
      loadError = e.message || String(e);
      return false;
    }
  };

  function resize() {
    if (!renderer || !container) return;
    const w = container.clientWidth || 800, h = container.clientHeight || 600;
    renderer.setSize(w, h, false);
    // Render the lower slice of a taller frustum: the board lifts off the
    // bottom of the screen instead of sliding under the action bar.
    const pad = Math.min(SAFE_BOTTOM, h * 0.3);
    const fullH = h + pad;
    cam.vFrac = h / fullH;
    camera.aspect = w / fullH;
    camera.setViewOffset(w, fullH, 0, pad, w, h);
    camera.updateProjectionMatrix();
    frameCamera();
  }
  api.resize = resize;

  api.repaint = function () { if (api.ready) drawTexture(); };

  let ownedSig = null;
  api.update = function () {
    if (!api.ready) return;
    // the top texture is 4 megapixels, so only repaint it when a deed changed
    const sig = JSON.stringify(S.owned);
    if (sig !== ownedSig) { ownedSig = sig; drawTexture(); }
    syncPawns();
    syncBuildings();
    api.focus(focusP, focusG);
  };
  api.unmount = function () {
    if (raf) cancelAnimationFrame(raf);
    raf = null;
    window.removeEventListener('resize', resize);
    if (renderer) { renderer.dispose(); if (renderer.domElement.parentNode) renderer.domElement.remove(); }
    api.ready = false;
    pawns = {}; overlays = []; dice = []; scene = null;
  };

  return api;
})();

if (typeof module !== 'undefined') module.exports = { Board3D };
</script>
<script>/* ============================================================
   MOGUL — interface
   ============================================================ */

const $ = (sel, root = document) => root.querySelector(sel);
const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
const esc = Engine.esc;

let S = null;            // game state
let MY_ID = null;        // which seat this browser controls
let LOCAL_ALL = true;    // hot-seat: this browser plays every human seat
let net = null;          // set by net.js when online

/* The board is WebGL only. A DOM fallback existed but kept the two renderers
   fighting over hover, highlighting and animation, so it was removed. */

let walkSeq = -1;

function reduceMotion() {
  return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

function renderDice(animate) {
  if (animate && Board3D.ready) { Board3D.roll(S.dice[0], S.dice[1]); Sfx.dice(); }
}

function syncPieces() {
  if (!Board3D.ready) return;
  Board3D.update();
  const lm = S.lastMove;
  if (lm && lm.seq !== walkSeq) {
    walkSeq = lm.seq;
    if (lm.walk && !reduceMotion() && lm.from !== lm.to) {
      Board3D.walk(lm.player, lm.from, lm.to, lm.back);
      const hops = Math.min(12, ((lm.to - lm.from) % 40 + 40) % 40);
      for (let k = 0; k < hops; k++) setTimeout(Sfx.step, k * 150);
      setTimeout(Sfx.land, hops * 150);
    } else if (!lm.walk) {
      Sfx.jail();
    }
  }
}

/* ---------- hover focus ---------- */

let focusPlayer = null, focusGroup = null;

function highlightPlayer(id) { focusPlayer = id; applyHighlight(); }
function highlightGroup(g) { focusGroup = g; applyHighlight(); }
function applyHighlight() { if (Board3D.ready) Board3D.focus(focusPlayer, focusGroup); }

/* ---------- property peek card ---------- */
function showPeek(i, node) {
  const t = BOARD[i];
  if (!t.price) return hidePeek();
  const peek = $('#peek');
  const o = S.owned[i];
  let rows = '';

  if (t.type === 'property') {
    const labels = ['with rent', 'with one house', 'with two houses', 'with three houses', 'with four houses', 'with a hotel'];
    rows = t.rent.map((r, k) => {
      const hl = o && o.houses === k ? ' class="hl"' : (!o && k === 0 ? ' class="hl"' : '');
      return `<tr${hl}><td>${labels[k]}</td><td>$${r}</td></tr>`;
    }).join('');
  } else if (t.type === 'airport') {
    rows = t.rent.map((r, k) => {
      const n = o ? Engine.countOwned(S, o.by, 'AIR') : 0;
      return `<tr${n === k + 1 ? ' class="hl"' : ''}><td>${k + 1} airport${k ? 's' : ''} owned</td><td>$${r}</td></tr>`;
    }).join('');
  } else {
    rows = `<tr><td>1 utility owned</td><td>4 &times; dice</td></tr><tr><td>2 utilities owned</td><td>10 &times; dice</td></tr>`;
  }

  const houseCost = t.type === 'property' ? GROUPS[t.group].house : null;
  peek.innerHTML = `
    <div class="ph">${t.group && FLAGS[t.group] ? `<span class="t-flag">${FLAGS[t.group]}</span>` : ''}${esc(t.name)}</div>
    <table><tr><th>when</th><th>get</th></tr>${rows}</table>
    <div class="pf">
      ${o ? `Owner &nbsp;<span class="ltag"><i style="background:${Engine.P(S, o.by).color}"></i>${esc(Engine.P(S, o.by).name)}</span><br>` : ''}
      Price $${t.price}${houseCost ? ` &nbsp;·&nbsp; 🏠 $${houseCost} &nbsp;·&nbsp; 🏨 $${houseCost}` : ''}
      ${o && o.mortgaged ? '<br><b style="color:var(--bad)">Mortgaged</b>' : ''}
    </div>`;
  const r = node.getBoundingClientRect();
  let x = r.left + r.width / 2 - 115, y = r.top + r.height + 8;
  if (y + 260 > window.innerHeight) y = r.top - 268;
  peek.style.left = Math.max(8, Math.min(x, window.innerWidth - 240)) + 'px';
  peek.style.top = Math.max(8, y) + 'px';
  peek.classList.add('on');
}
function hidePeek() { $('#peek').classList.remove('on'); }

/* same card, positioned at the cursor instead of against a DOM tile */
function showPeekAt(i, px, py) {
  showPeek(i, { getBoundingClientRect: () => ({ left: px, top: py, width: 0, height: 0 }) });
}

/* ============================================================
   SIDE PANEL
   ============================================================ */

const lastCash = {};

function renderHUD() {
  const players = $('#hudPlayers'), props = $('#hudProps');
  const logSlot = $('#hudLog'), bar = $('#hudBar'), prompt = $('#hudPrompt');
  if (!players) return;
  [players, props, logSlot, bar, prompt].forEach(n => n.innerHTML = '');

  renderPlayerPanel(players);
  renderLogPanel(logSlot);
  renderMyProperties(props);
  renderTradePanel(props);
  renderBar(bar);
  renderPrompt(prompt);
}

function renderPlayerPanel(slot) {
  // hosts keep the invite handy: latecomers and reconnects both need it
  if (net && net.mode === 'host') {
    const chip = el('div', 'card roomchip');
    chip.appendChild(el('div', 'roomcode', `Room <b>${esc(net.code)}</b>`));
    const copy = el('button', 'btn', 'Copy invite link');
    copy.onclick = async () => {
      const link = Net.inviteLink();
      try { await navigator.clipboard.writeText(link); } catch { toast(link); }
      copy.textContent = 'Copied ✓';
      Sfx.click();
      setTimeout(() => copy.textContent = 'Copy invite link', 1600);
    };
    chip.appendChild(copy);
    slot.appendChild(chip);
  } else if (net && net.mode === 'guest') {
    const chip = el('div', 'card roomchip');
    chip.appendChild(el('div', 'roomcode', `Room <b>${esc(net.code)}</b>`));
    slot.appendChild(chip);
  }

  const card = el('div', 'card');
  S.order.forEach(id => {
    const p = Engine.P(S, id);
    const cur = Engine.current(S);
    const row = el('div', 'prow' + (cur && cur.id === id ? ' active' : '') + (p.bankrupt ? ' dead' : ''));
    const av = el('div', 'pav', '<div class="eye"></div><div class="eye"></div>');
    av.style.background = p.color;
    row.appendChild(av);
    row.appendChild(el('div', 'pname',
      `${esc(p.name)}${p.id === MY_ID ? ' <span class="pmeta">you</span>' : ''}${p.inPrison ? ' ⛓' : ''}${p.jailCards ? ' 🎟'.repeat(p.jailCards) : ''}`));
    row.appendChild(el('div', 'pcash', `$${p.cash}`));
    const owns = Object.keys(S.owned).filter(k => S.owned[k].by === id).length;
    if (owns) row.appendChild(el('div', 'powns', `${owns}`));
    row.title = `Net worth $${Engine.netWorth(S, id)}`;
    row.addEventListener('mouseenter', () => highlightPlayer(id));
    row.addEventListener('mouseleave', () => highlightPlayer(null));

    const was = lastCash[id];
    if (was != null && was !== p.cash && S.phase === 'playing') {
      const d = p.cash - was;
      if (id === MY_ID || LOCAL_ALL) (d > 0 ? Sfx.cashIn : Sfx.cashOut)();
      const f = el('div', 'cashfly ' + (d > 0 ? 'up' : 'down'), (d > 0 ? '+' : '−') + '$' + Math.abs(d));
      row.appendChild(f);
      setTimeout(() => f.remove(), 1500);
    }
    lastCash[id] = p.cash;
    card.appendChild(row);
  });
  slot.appendChild(card);
}

function renderLogPanel(slot) {
  const card = el('div', 'card');
  const box = el('div', 'logbox');
  S.log.slice(-9).forEach(l => {
    const line = el('div', '', l.html);
    if (l.meta && l.meta.kind === 'trade') {
      const ref = line.querySelector('.lref');
      if (ref) {
        ref.classList.add('live');
        ref.addEventListener('mouseenter', () => showTradeTip(ref, l.meta.trade));
        ref.addEventListener('mouseleave', hideTradeTip);
      }
    }
    box.appendChild(line);
  });
  card.appendChild(box);
  slot.appendChild(card);
}

/* the word "trade" in the log opens the exact terms that were offered */
function showTradeTip(anchor, t) {
  let tip = $('#tradetip');
  if (!tip) { tip = el('div'); tip.id = 'tradetip'; document.body.appendChild(tip); }
  const from = Engine.P(S, t.from), to = Engine.P(S, t.to);
  if (!from || !to) return;
  tip.innerHTML = `
    <div class="tthead">
      <span class="ltag"><i style="background:${from.color}"></i>${esc(from.name)}</span>
      <span class="tarrow">→</span>
      <span class="ltag"><i style="background:${to.color}"></i>${esc(to.name)}</span>
    </div>
    <div class="ttline"><span class="tclabel give">${esc(from.name)} gave</span> ${bagHTML(t.give)}</div>
    <div class="ttline"><span class="tclabel get">${esc(to.name)} gave</span> ${bagHTML(t.want)}</div>
    ${t.note ? `<div class="tcnote">“${esc(t.note)}”</div>` : ''}`;
  const r = anchor.getBoundingClientRect();
  tip.style.left = Math.min(r.left, window.innerWidth - 300) + 'px';
  tip.style.top = Math.max(8, r.top - 8) + 'px';
  tip.classList.add('on');
}
function hideTradeTip() { const t = $('#tradetip'); if (t) t.classList.remove('on'); }

function renderTradePanel(slot) {
  if (!S.trades.length) return;
  const c = el('div', 'card');
  c.appendChild(el('h3', '', `Open trades (${S.trades.length})`));
  S.trades.forEach(t => c.appendChild(tradeCard(t)));
  slot.appendChild(c);
}

/* Bottom bar: whose turn it is, the roll/end action, and the tools. */
function renderBar(slot) {
  const card = el('div', 'card');
  const cur = Engine.current(S);

  const line = el('div', 'turnline');
  if (S.phase === 'ended') {
    const w = Engine.P(S, S.winner);
    if (!renderBar.celebrated) { renderBar.celebrated = true; Sfx.win(); }
    line.innerHTML = `🏆 <b>${w ? esc(w.name) : '—'}</b> wins!`;
  } else if (cur) {
    line.innerHTML = `<span class="ltag"><i style="background:${cur.color}"></i>${esc(cur.name)}</span>
      ${cur.id === actorId() ? '— your move' : 'is playing…'}`;
  }
  card.appendChild(line);

  const row = el('div', 'barrow');
  const acting = actorId();
  const isMine = cur && cur.id === acting;

  if (S.phase === 'ended') {
    const again = el('button', 'btn primary big', '↻ New game');
    again.onclick = () => location.reload();
    row.appendChild(again);
  } else if (!S.pending && isMine) {
    if (cur.inPrison && !S.rolled) {
      const r = el('button', 'btn primary big', '🎲 Roll for doubles');
      r.onclick = doRoll; row.appendChild(r);
      const bail = el('button', 'btn', 'Pay $50 bail');
      bail.onclick = () => act({ type: 'payBail' });
      if (cur.cash < 50) bail.disabled = true;
      row.appendChild(bail);
      if (cur.jailCards) {
        const j = el('button', 'btn good', 'Use free pass 🎟');
        j.onclick = () => act({ type: 'useJailCard' });
        row.appendChild(j);
      }
    } else if (!S.rolled) {
      const r = el('button', 'btn primary big', '🎲 Roll dice');
      r.onclick = doRoll; row.appendChild(r);
    } else {
      const e = el('button', 'btn good big', 'End turn ➜');
      e.onclick = () => act({ type: 'endTurn' });
      row.appendChild(e);
    }
  }

  const tools = el('div', 'tools');
  const bTrade = el('button', 'btn', '⇄ Trades');
  bTrade.onclick = () => openTrade();
  const bSound = el('button', 'btn', Sfx.muted ? '🔇 Sound' : '🔊 Sound');
  bSound.onclick = () => { Sfx.setMuted(!Sfx.muted); Sfx.click(); renderHUD(); };
  tools.append(bTrade, bSound);
  row.appendChild(tools);

  card.appendChild(row);
  slot.appendChild(card);
}

/* Anything that needs a decision appears in the middle of the screen. */
function renderPrompt(slot) {
  const pd = S.pending;
  if (!pd || S.phase !== 'playing') return;
  const acting = actorId();

  const box = el('div', 'prompt');
  const row = el('div', 'promptRow');

  if (pd.kind === 'buy' && pd.player === acting) {
    const t = BOARD[pd.tile];
    box.appendChild(el('div', 'promptTitle', esc(t.name)));
    box.appendChild(el('div', 'promptSub',
      `Unowned — yours for <span class="promptPrice">$${t.price}</span>`));
    const buy = el('button', 'btn good big', `Buy for $${t.price}`);
    buy.onclick = () => act({ type: 'buy' });
    if (Engine.P(S, acting).cash < t.price) buy.disabled = true;
    const skip = el('button', 'btn', S.settings.auction ? 'Send to auction' : 'Skip');
    skip.onclick = () => act({ type: 'skipBuy' });
    row.append(buy, skip);
  } else if (pd.kind === 'auction') {
    const t = BOARD[pd.tile];
    const bidder = pd.bidders[pd.turnIdx % pd.bidders.length];
    box.appendChild(el('div', 'promptTitle', `Auction — ${esc(t.name)}`));
    box.appendChild(el('div', 'promptSub',
      `Highest bid <span class="promptPrice">$${pd.bid}</span>${pd.leader ? ' by ' + esc(Engine.P(S, pd.leader).name) : ''}`));
    if (bidder !== acting) {
      box.appendChild(el('div', 'pmeta', `Waiting for ${esc(Engine.P(S, bidder).name)}…`));
    } else {
      [10, 50, 100].forEach(inc => {
        const b = el('button', 'btn', `+$${inc}`);
        b.onclick = () => act({ type: 'bid', amount: pd.bid + inc });
        if (Engine.P(S, acting).cash < pd.bid + inc) b.disabled = true;
        row.appendChild(b);
      });
      const p = el('button', 'btn bad', 'Pass');
      p.onclick = () => act({ type: 'passBid' });
      row.appendChild(p);
    }
  } else if (pd.kind === 'debt' && pd.player === acting) {
    box.appendChild(el('div', 'promptTitle', `You owe $${pd.amount}`));
    box.appendChild(el('div', 'promptSub',
      `Sell buildings${S.settings.mortgage ? ' or mortgage property' : ''} to cover it.`));
    const jump = el('button', 'btn primary', '↓ Open my properties');
    jump.onclick = () => {
      scrollTo(document.querySelector('#hudProps .card.props'));
      const first = document.querySelector('.proprow .mini:not([disabled])');
      if (first) { first.focus(); first.closest('.proprow').classList.add('flash'); }
    };
    const fold = el('button', 'btn bad', 'Declare bankruptcy');
    fold.onclick = () => act({ type: 'declareBankrupt' });
    if (Engine.liquidValue(S, acting) >= pd.amount) fold.disabled = true;
    row.append(jump, fold);
  } else {
    return;
  }

  box.appendChild(row);
  slot.appendChild(box);
}

function is3D() { return Board3D.ready; }

async function applyView() {
  const host = $('#scene');
  if (Board3D.ready) { Board3D.resize(); Board3D.update(); return true; }
  host.classList.add('loading');
  const ok = await Board3D.mount(host);
  host.classList.remove('loading');
  if (!ok) {
    host.classList.add('failed');
    host.innerHTML = `<div class="scenefail">
      <h2>The 3D board could not start</h2>
      <p>${esc(Board3D.error() || 'WebGL is unavailable.')}</p>
      <p class="pmeta">Try another browser, or enable hardware acceleration in its settings.</p>
    </div>`;
    return false;
  }
  if (S.phase !== 'lobby') render();
  return true;
}

function actorId() {
  // hot-seat: this browser acts as whoever the game is waiting on
  if (!LOCAL_ALL) return MY_ID;
  const pd = S.pending;
  if (pd) {
    if (pd.kind === 'auction') return pd.bidders[pd.turnIdx % pd.bidders.length];
    if (pd.player) return pd.player;
  }
  const c = Engine.current(S);
  return c ? c.id : MY_ID;
}

function renderActions(box) {
  box.innerHTML = '';
  if (S.phase !== 'playing') return;
  const cur = Engine.current(S);
  const acting = actorId();
  const isMine = cur && cur.id === acting;

  const add = (label, cls, fn, disabled) => {
    const b = el('button', 'btn ' + (cls || ''), label);
    b.onclick = fn; if (disabled) b.disabled = true;
    box.appendChild(b); return b;
  };

  const pd = S.pending;

  if (pd && pd.kind === 'debt' && pd.player === acting) {
    box.appendChild(el('div', '', `<b style="color:var(--bad)">You owe $${pd.amount}.</b> Sell buildings${S.settings.mortgage ? ' or mortgage' : ''} to cover it.`));
    const jump = el('button', 'btn primary', '↓ Sell from my properties');
    jump.onclick = () => {
      scrollTo(document.querySelector('#hudProps .card.props'));
      const first = document.querySelector('.proprow .mini:not([disabled])');
      if (first) { first.focus(); first.closest('.proprow').classList.add('flash'); }
    };
    box.appendChild(jump);
    const rescue = Engine.liquidValue(S, acting);
    add('Declare bankruptcy', 'bad', () => act({ type: 'declareBankrupt' }), rescue >= pd.amount);
    return;
  }

  if (pd && pd.kind === 'buy' && pd.player === acting) {
    const t = BOARD[pd.tile];
    box.appendChild(el('div', '', `<b>${esc(t.name)}</b> is unowned — $${t.price}`));
    add(`Buy for $${t.price}`, 'good', () => act({ type: 'buy' }), Engine.P(S, acting).cash < t.price);
    add(S.settings.auction ? 'Send to auction' : 'Skip', '', () => act({ type: 'skipBuy' }));
    return;
  }

  if (pd && pd.kind === 'auction') {
    renderAuction(box, pd);
    return;
  }

  if (!isMine) {
    box.appendChild(el('div', 'pmeta', cur ? `Waiting for ${esc(cur.name)}…` : ''));
    return;
  }

  if (cur.inPrison && !S.rolled) {
    add('🎲 Roll for doubles', 'primary', () => doRoll());
    add('Pay $50 bail', '', () => act({ type: 'payBail' }), cur.cash < 50);
    if (cur.jailCards) add('Use free pass 🎟', 'good', () => act({ type: 'useJailCard' }));
    return;
  }

  if (!S.rolled) add('🎲 Roll dice', 'primary', () => doRoll());
  else add('End turn ➜', 'good', () => act({ type: 'endTurn' }));
}

function renderAuction(box, au) {
  const t = BOARD[au.tile];
  const bidder = au.bidders[au.turnIdx];
  box.appendChild(el('div', '', `<b>Auction — ${esc(t.name)}</b><br>
    Highest bid: <span class="money">$${au.bid}</span> ${au.leader ? 'by ' + esc(Engine.P(S, au.leader).name) : ''}`));
  const acting = actorId();
  if (bidder !== acting) { box.appendChild(el('div', 'pmeta', `Waiting for ${esc(Engine.P(S, bidder).name)}…`)); return; }
  [10, 50, 100].forEach(inc => {
    const b = el('button', 'btn', `+$${inc}`);
    b.onclick = () => act({ type: 'bid', amount: au.bid + inc });
    if (Engine.P(S, acting).cash < au.bid + inc) b.disabled = true;
    box.appendChild(b);
  });
  const p = el('button', 'btn bad', 'Pass'); p.onclick = () => act({ type: 'passBid' }); box.appendChild(p);
}

/* ============================================================
   ACTIONS
   ============================================================ */

const SOUND_FOR = {
  buy: 'buy', build: 'build', sellHouse: 'build',
  mortgage: 'cashIn', unmortgage: 'cashOut',
  proposeTrade: 'trade', endTurn: 'turn',
  payBail: 'cashOut', useJailCard: 'cashIn',
  bid: 'click', passBid: 'click', declareBankrupt: 'bad',
};

function act(action, who) {
  const id = who || actorId();
  const cue = SOUND_FOR[action.type];
  if (cue && Sfx[cue]) Sfx[cue]();
  if (action.type === 'respondTrade') (action.accept ? Sfx.trade : Sfx.click)();
  if (net && net.mode === 'guest') { net.send(action); return; }
  Engine.applyAction(S, id, action);
  afterAction();
  if (net && net.mode === 'host') net.broadcast();
}

function doRoll() {
  act({ type: 'roll' });
  renderDice(true);
}

function afterAction() {
  render();
}

/* ============================================================
   MODALS
   ============================================================ */

function modal(title, sub, bodyNode, wide) {
  closeModal();
  const ov = el('div', 'overlay'); ov.id = 'overlay';
  const m = el('div', 'modal');
  if (wide) m.style.width = 'min(760px,95vw)';
  m.style.position = 'relative';
  const x = el('button', 'x', '✕'); x.onclick = closeModal;
  m.append(x, el('h2', '', title));
  if (sub) m.appendChild(el('div', 'sub', sub));
  m.appendChild(bodyNode);
  ov.appendChild(m);
  ov.addEventListener('click', e => { if (e.target === ov) closeModal(); });
  document.body.appendChild(ov);
}
function closeModal() { const o = $('#overlay'); if (o) o.remove(); }

/* ---------- my properties ----------
   Always on screen in the sidebar: owning things is the whole game, so it
   should never be hidden behind a button.                                */

function propertyRow(i, owner) {
  const t = BOARD[i], o = S.owned[i];
  const row = el('div', 'proprow');
  row.dataset.tile = i;

  const swatch = el('span', 'propdot');
  swatch.style.background = GROUPS[t.group] ? GROUPS[t.group].color : '#9a8b7a';
  const label = el('div', 'propname', esc(t.name));
  if (o.houses === 5) label.appendChild(el('span', 'propb', '🏨'));
  else if (o.houses) label.appendChild(el('span', 'propb', '🏠'.repeat(o.houses)));
  if (o.mortgaged) label.appendChild(el('span', 'propm', 'mortgaged'));
  row.append(swatch, label);

  row.addEventListener('mouseenter', () => highlightGroup(t.group && GROUPS[t.group] ? t.group : null));
  row.addEventListener('mouseleave', () => highlightGroup(null));

  const acts = el('div', 'propacts');
  if (t.type === 'property') {
    const cost = GROUPS[t.group].house;
    const up = el('button', 'mini good', `+🏠 $${cost}`);
    up.onclick = () => act({ type: 'build', tile: i }, owner);
    if (!Engine.canBuild(S, owner, i)) up.disabled = true;
    const down = el('button', 'mini', `−🏠 $${Math.floor(cost / 2)}`);
    down.onclick = () => act({ type: 'sellHouse', tile: i }, owner);
    if (!Engine.canSell(S, owner, i)) down.disabled = true;
    acts.append(up, down);
  }
  if (S.settings.mortgage) {
    const m = el('button', 'mini bad',
      o.mortgaged ? `Lift $${Math.ceil(t.price * 0.55)}` : `Mortgage $${Math.floor(t.price / 2)}`);
    m.onclick = () => act({ type: o.mortgaged ? 'unmortgage' : 'mortgage', tile: i }, owner);
    acts.appendChild(m);
  }
  if (acts.children.length) row.appendChild(acts);
  return row;
}

function renderMyProperties(side) {
  const me = actorId();
  const mine = Object.keys(S.owned).map(Number).filter(i => S.owned[i].by === me).sort((a, b) => a - b);

  const card = el('div', 'card props');
  card.appendChild(el('h3', '', `My properties (${mine.length})`));

  if (!mine.length) {
    card.appendChild(el('div', 'empty', 'Nothing yet. Land on a free tile and buy it.'));
    side.appendChild(card);
    return;
  }

  const byGroup = {};
  mine.forEach(i => { const g = BOARD[i].group; (byGroup[g] = byGroup[g] || []).push(i); });

  Object.entries(byGroup).forEach(([g, tiles]) => {
    const label = GROUPS[g] ? GROUPS[g].name : (g === 'AIR' ? 'Airports' : 'Utilities');
    const full = GROUPS[g] ? Engine.ownsFullSet(S, me, g) : false;
    const head = el('div', 'propgroup' + (full ? ' full' : ''),
      `${esc(label)}${full ? ' <span class="setflag">full set</span>' : ` <span class="pmeta">${tiles.length}/${Engine.groupTiles(g).length}</span>`}`);
    card.appendChild(head);
    tiles.forEach(i => card.appendChild(propertyRow(i, me)));
  });

  side.appendChild(card);
}

/* clicking a tile on the board points at its row instead of opening a dialog */
/* not every environment implements smooth scrolling */
function scrollTo(node) {
  if (node && typeof node.scrollIntoView === 'function') {
    try { node.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch { node.scrollIntoView(); }
  }
}

function focusProperty(i) {
  const row = document.querySelector(`.proprow[data-tile="${i}"]`);
  if (!row) { toast(BOARD[i].name + ' is not yours'); return; }
  scrollTo(row);
  row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash');
}

/* ---------- trade ----------
   Two rules drive this UI, both aimed at the misclick problem:
   direction is never implied (each side is labelled and colour-coded),
   and anything irreversible needs a second, differently-worded click.   */

function tileChipHTML(i) {
  const t = BOARD[i];
  const c = GROUPS[t.group] ? GROUPS[t.group].color : '#8b8bb0';
  return `<span class="tchip"><i style="background:${c}"></i>${esc(t.name)}</span>`;
}

function bagHTML(bag) {
  const bits = [];
  if (bag.cash) bits.push(`<span class="money">$${bag.cash}</span>`);
  bag.tiles.forEach(i => bits.push(tileChipHTML(i)));
  return bits.length ? bits.join(' ') : '<span class="pmeta">nothing</span>';
}

function openTrade(preselect) {
  const me = actorId();
  const others = S.players.filter(p => p.id !== me && !p.bankrupt);
  if (!others.length) { toast('No one to trade with'); return; }

  let target = preselect || null;
  const give = { cash: 0, tiles: [] };
  const want = { cash: 0, tiles: [] };
  const body = el('div');
  body.dataset.note = '';

  function pickStep() {
    body.innerHTML = '';
    body.appendChild(el('div', 'sechead', 'Who do you want to trade with?'));
    others.forEach(p => {
      const b = el('button', 'pickrow');
      const av = el('div', 'pav', '<div class="eye"></div><div class="eye"></div>');
      av.style.background = p.color;
      const props = Object.keys(S.owned).filter(i => S.owned[i].by === p.id).length;
      b.append(av, el('span', 'pname', esc(p.name)),
        el('span', 'pmeta', `$${p.cash} · ${props} propert${props === 1 ? 'y' : 'ies'}`));
      b.onclick = () => { target = p.id; buildStep(); };
      body.appendChild(b);
    });
    modalTitle('Create a trade', 'Pick a player first.');
  }

  function assetPicker(pid, bag, onChange) {
    const p = Engine.P(S, pid);
    const wrap = el('div', 'picker');

    const cash = el('div', 'cashctl');
    const range = el('input');
    range.type = 'range'; range.className = 'slider';
    range.min = 0; range.max = Math.max(0, p.cash); range.step = 5; range.value = bag.cash;
    const num = el('input');
    num.type = 'number'; num.className = 'cashnum';
    num.min = 0; num.max = Math.max(0, p.cash); num.value = bag.cash;

    const sync = (v) => {
      bag.cash = Math.max(0, Math.min(p.cash, Math.round(v) || 0));
      range.value = bag.cash; num.value = bag.cash;
      onChange();
    };
    range.oninput = () => sync(+range.value);
    num.oninput = () => sync(+num.value);

    const quick = el('div', 'quick');
    [['0', 0], ['¼', .25], ['½', .5], ['Max', 1]].forEach(([lbl, f]) => {
      const b = el('button', 'mini', lbl);
      b.onclick = () => sync(p.cash * f);
      quick.appendChild(b);
    });
    const row = el('div', 'cashrow');
    row.append(el('span', 'cashlabel', '$'), num, quick);
    cash.append(range, row);
    wrap.appendChild(cash);

    const tiles = Object.keys(S.owned).map(Number)
      .filter(i => S.owned[i].by === pid && !S.owned[i].houses)
      .sort((a, b) => a - b);

    if (!tiles.length) {
      wrap.appendChild(el('div', 'empty',
        Object.keys(S.owned).some(i => S.owned[i].by === pid)
          ? 'All their property has buildings on it — sell those first to trade it.'
          : 'No property to trade yet.'));
      return wrap;
    }

    const list = el('div', 'plist');
    tiles.forEach(i => {
      const t = BOARD[i];
      const chip = el('button', 'pchip' + (bag.tiles.includes(i) ? ' sel' : ''));
      const dot = el('span', 'dot');
      dot.style.background = GROUPS[t.group] ? GROUPS[t.group].color : '#9a8b7a';
      chip.append(dot, el('span', '', esc(t.name)), el('span', 'amt', `$${t.price}`));
      chip.onclick = () => {
        const k = bag.tiles.indexOf(i);
        if (k < 0) bag.tiles.push(i); else bag.tiles.splice(k, 1);
        chip.classList.toggle('sel');
        onChange();
      };
      list.appendChild(chip);
    });
    wrap.appendChild(list);
    return wrap;
  }

  function buildStep() {
    body.innerHTML = '';
    const them = Engine.P(S, target);
    const mine = Engine.P(S, me);

    const back = el('button', 'linkbtn', '← change player');
    back.onclick = pickStep;
    body.appendChild(back);

    const avatar = (p) => {
      const a = el('div', 'pav', '<div class="eye"></div><div class="eye"></div>');
      a.style.background = p.color;
      return a;
    };

    const cols = el('div', 'tradecols');
    const mk = (p, cls, verb) => {
      const c = el('div', 'tradeside ' + cls);
      const head = el('div', 'tshead');
      head.append(avatar(p), el('span', 'tsname', esc(p.name)), el('span', 'tsverb', verb));
      c.appendChild(head);
      c.appendChild(el('div', 'tscash', `has $${p.cash}`));
      return c;
    };
    const giveCol = mk(mine, 'give', 'gives');
    const getCol = mk(them, 'get', 'gives');
    cols.append(giveCol, getCol);
    body.appendChild(cols);

    const summary = el('div', 'tsum');
    let sendBtn;
    const refresh = () => {
      summary.innerHTML =
        `<div class="tsline"><span class="tclabel give">out</span> ${bagHTML(give)}</div>` +
        `<div class="tsline"><span class="tclabel get">in</span> ${bagHTML(want)}</div>`;
      const empty = !give.cash && !want.cash && !give.tiles.length && !want.tiles.length;
      sendBtn.disabled = empty;
      sendBtn.textContent = empty ? 'Add something to offer' : `➤ Send to ${them.name}`;
    };

    giveCol.appendChild(assetPicker(me, give, () => refresh()));
    getCol.appendChild(assetPicker(target, want, () => refresh()));

    const note = el('input');
    note.type = 'text'; note.maxLength = 120;
    note.placeholder = 'Add a note — e.g. "lifetime pass on Germany"';
    note.value = body.dataset.note;
    note.oninput = () => body.dataset.note = note.value;
    body.append(note, summary);

    sendBtn = el('button', 'btn primary wide');
    sendBtn.style.marginTop = '12px';
    sendBtn.onclick = () => {
      act({ type: 'proposeTrade', to: target, note: body.dataset.note, give, want });
      closeModal();
      toast('Offer sent — everyone can see it');
    };
    body.appendChild(sendBtn);
    refresh();
    modalTitle('Create a trade', `Public offer. Only ${esc(them.name)} can accept or decline it.`);
  }

  modal('Create a trade', '', body, true);
  if (target) buildStep(); else pickStep();
}

function modalTitle(title, sub) {
  const m = $('#overlay .modal'); if (!m) return;
  m.querySelector('h2').textContent = title;
  let s = m.querySelector('.sub');
  if (!s) { s = el('div', 'sub'); m.querySelector('h2').after(s); }
  s.innerHTML = sub;
}

/* One public card per live offer. Only the receiver gets the answer buttons. */
function tradeCard(t) {
  const from = Engine.P(S, t.from), to = Engine.P(S, t.to);
  const wrap = el('div', 'tradecard');
  const acting = actorId();

  wrap.appendChild(el('div', 'tchead', `
    <span class="ltag"><i style="background:${from.color}"></i>${esc(from.name)}</span>
    <span class="tarrow">→</span>
    <span class="ltag"><i style="background:${to.color}"></i>${esc(to.name)}</span>`));

  wrap.appendChild(el('div', 'tcbody', `
    <div class="tcline"><span class="tclabel give">${esc(from.name)} gives</span> ${bagHTML(t.give)}</div>
    <div class="tcline"><span class="tclabel get">${esc(to.name)} gives</span> ${bagHTML(t.want)}</div>
    ${t.note ? `<div class="tcnote">“${esc(t.note)}”</div>` : ''}`));

  const foot = el('div', 'tcfoot');
  // hot-seat: one screen, so the answer buttons are always reachable and are
  // labelled with the name of whoever is meant to press them.
  const canAnswer = LOCAL_ALL || acting === t.to;
  const canWithdraw = LOCAL_ALL || acting === t.from;

  if (canAnswer) {
    // deliberately asymmetric: accepting costs two clicks, declining one
    const yes = el('button', 'btn good');
    const yesLabel = LOCAL_ALL ? `✓ ${to.name} accepts` : '✓ Accept';
    yes.textContent = yesLabel;
    let armed = false, timer = null;
    yes.onclick = () => {
      if (!armed) {
        armed = true;
        yes.textContent = 'Tap again to confirm';
        yes.classList.add('arming');
        timer = setTimeout(() => { armed = false; yes.textContent = yesLabel; yes.classList.remove('arming'); }, 4000);
        return;
      }
      clearTimeout(timer);
      act({ type: 'respondTrade', id: t.id, accept: true }, t.to);
    };
    const no = el('button', 'btn bad');
    no.textContent = LOCAL_ALL ? `✕ ${to.name} declines` : '✕ Decline';
    no.onclick = () => act({ type: 'respondTrade', id: t.id, accept: false }, t.to);
    foot.append(yes, no);
  }
  if (canWithdraw && !canAnswer) {
    const c = el('button', 'btn');
    c.textContent = 'Withdraw offer';
    c.onclick = () => act({ type: 'cancelTrade', id: t.id }, t.from);
    foot.appendChild(c);
  }
  if (!canAnswer && !canWithdraw) {
    foot.appendChild(el('div', 'pmeta', `Waiting for ${esc(to.name)} to answer…`));
  }
  wrap.appendChild(foot);
  return wrap;
}

/* ---------- card popup ---------- */
let cardEl = null, cardShownAt = 0, cardTimer = null;
function renderCardPopup() {
  const c = S.cardShow;
  if (!c) { if (cardEl) { cardEl.remove(); cardEl = null; } return; }
  if (c.at === cardShownAt) return;              // already on screen
  cardShownAt = c.at;
  Sfx.card();
  if (cardEl) cardEl.remove();
  cardEl = el('div', 'cardpop ' + c.deckKind, esc(c.text));
  const x = el('button', 'x', '✕');
  x.onclick = () => { cardEl.remove(); cardEl = null; };
  cardEl.appendChild(x);
  document.body.appendChild(cardEl);
  clearTimeout(cardTimer);
  cardTimer = setTimeout(() => { if (cardEl) { cardEl.remove(); cardEl = null; } }, 4500);
}

function toast(msg) {
  const t = el('div', 'toast', esc(msg));
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1800);
}

/* ============================================================
   LOBBY
   ============================================================ */

function renderLobby() {
  let lob = $('#lobby');
  if (!lob) { lob = el('div'); lob.id = 'lobby'; document.body.appendChild(lob); }
  const takenColors = S.players.map(p => p.color);
  const me = MY_ID ? Engine.P(S, MY_ID) : null;

  lob.innerHTML = '';
  const main = el('div', 'lmain');
  main.appendChild(el('h1', '', 'MO<span>GUL</span>'));

  // A guest arriving on an invite link picks a name before connecting.
  const urlCode = Net.codeFromURL();
  if (urlCode && !net) {
    const j = el('div', 'card joinbox');
    j.appendChild(el('h3', '', `Join room ${esc(urlCode)}`));
    const jn = el('input'); jn.type = 'text'; jn.maxLength = 14;
    jn.value = localStorage.getItem('mogul.name') || '';
    jn.placeholder = 'Your name';
    const go = el('button', 'btn primary wide', 'Join ➜');
    go.style.marginTop = '10px';
    go.onclick = () => {
      const nm = (jn.value || 'Player').slice(0, 14);
      localStorage.setItem('mogul.name', nm);
      Net.join(urlCode, nm);
    };
    jn.onkeydown = (e) => { if (e.key === 'Enter') go.click(); };
    j.append(jn, go);
    if (Net.status === 'error') j.appendChild(el('div', 'neterr', esc(Net.error)));
    const solo = el('button', 'linkbtn', 'or play on this screen instead');
    solo.onclick = () => { history.replaceState(null, '', location.pathname); renderLobby(); };
    j.appendChild(solo);
    main.appendChild(j);
    lob.appendChild(main);
    lob.appendChild(settingsColumn(true));
    return;
  }

  main.appendChild(connectionPanel());
  main.appendChild(el('div', 'pmeta', net ? `Room ${net.room} — select your appearance` : 'Select your player appearance'));

  const sws = el('div', 'swatches');
  PLAYER_COLORS.forEach(c => {
    const taken = takenColors.includes(c) && (!me || me.color !== c);
    const b = el('button', 'sw' + (me && me.color === c ? ' sel' : '') + (taken ? ' taken' : ''),
      '<div class="eye"></div><div class="eye"></div>');
    b.style.background = c; b.style.color = c;
    b.onclick = () => {
      if (!me) return;
      if (net && net.mode === 'guest') { net.send({ type: 'rename', color: c }); return; }
      me.color = c; renderLobby();
      if (net && net.mode === 'host') net.broadcast();
    };
    sws.appendChild(b);
  });
  main.appendChild(sws);

  const nameBox = el('div'); nameBox.style.width = '260px';
  const inp = el('input'); inp.type = 'text'; inp.maxLength = 14;
  inp.value = me ? me.name : '';
  inp.placeholder = 'Your name';
  inp.oninput = () => {
    if (!me) return;
    me.name = inp.value.slice(0, 14) || 'Player';
    localStorage.setItem('mogul.name', me.name);
    clearTimeout(inp._t);
    inp._t = setTimeout(() => {
      if (net && net.mode === 'guest') net.send({ type: 'rename', name: me.name });
      else if (net && net.mode === 'host') net.broadcast();
    }, 400);
  };
  nameBox.appendChild(inp);
  main.appendChild(nameBox);

  const seats = el('div', 'card'); seats.style.width = '300px';
  seats.appendChild(el('h3', '', `Players ${S.players.length}/${S.settings.maxPlayers}`));
  S.players.forEach((p, k) => {
    const row = el('div', 'prow');
    const av = el('div', 'pav', '<div class="eye"></div><div class="eye"></div>'); av.style.background = p.color;
    row.append(av, el('div', 'pname', `${esc(p.name)}${k === 0 ? ' 👑' : ''}`));
    if (k > 0 && !net) {
      const rm = el('button', 'mini bad', '✕'); rm.onclick = () => { S.players.splice(k, 1); renderLobby(); };
      row.appendChild(rm);
    }
    seats.appendChild(row);
  });
  const isHost = !net || (S.players[0] && S.players[0].id === MY_ID);
  const addRow = el('div'); addRow.style.cssText = 'display:flex;gap:8px;margin-top:8px';
  const addP = el('button', 'btn wide', '+ Add friend');
  addP.onclick = () => {
    const free = PLAYER_COLORS.find(c => !S.players.map(x => x.color).includes(c));
    Engine.addPlayer(S, { name: 'Player ' + (S.players.length + 1), color: free });
    renderLobby();
  };
  if (net) addP.style.display = 'none';   // online seats arrive over the socket
  addRow.append(addP);
  seats.appendChild(addRow);
  main.appendChild(seats);

  const start = el('button', 'btn primary', 'Start game ➜');
  start.style.padding = '13px 28px';
  start.disabled = S.players.length < 2 || !isHost;
  if (net && !isHost) start.textContent = 'Waiting for the host…';
  start.onclick = () => {
    act({ type: 'start' }, S.players[0].id);
    lob.remove();
    render();
  };
  main.appendChild(start);
  lob.appendChild(main);

  lob.appendChild(settingsColumn(!!net && !isHost));
}

function connectionPanel() {
  const box = el('div', 'card netbox');
  if (!net) {
    box.appendChild(el('div', 'pmeta', 'Everyone on one screen, or one link each.'));
    const b = el('button', 'btn primary wide', '🌐 Create an online room');
    b.style.marginTop = '8px';
    b.onclick = () => { b.disabled = true; b.textContent = 'Opening…'; Net.host(); };
    box.appendChild(b);
    if (Net.status === 'error') box.appendChild(el('div', 'neterr', esc(Net.error)));
    return box;
  }
  if (net.mode === 'host') {
    box.appendChild(el('h3', '', `Room ${esc(net.code)}`));
    const link = Net.inviteLink();
    const row = el('div', 'linkrow');
    const inp = el('input'); inp.type = 'text'; inp.readOnly = true; inp.value = link;
    inp.onclick = () => inp.select();
    const copy = el('button', 'btn primary', 'Copy');
    copy.onclick = async () => {
      try { await navigator.clipboard.writeText(link); } catch { inp.select(); document.execCommand('copy'); }
      copy.textContent = 'Copied ✓';
      setTimeout(() => copy.textContent = 'Copy', 1600);
    };
    row.append(inp, copy);
    box.append(row, el('div', 'pmeta', 'Send this to your friends. Keep this tab open — it runs the game.'));
    return box;
  }
  box.appendChild(el('h3', '', `Room ${esc(net.code)}`));
  box.appendChild(el('div', 'pmeta',
    Net.status === 'open' ? 'Connected. Waiting for the host to start.' : 'Connecting…'));
  if (Net.status === 'error') box.appendChild(el('div', 'neterr', esc(Net.error)));
  return box;
}

function settingsColumn(readOnly) {
  const sideCol = el('div', 'lside');
  if (readOnly) sideCol.appendChild(el('div', 'pmeta', 'Only the host can change these.'));
  let section = '';
  SETTINGS_META.forEach(meta => {
    if (meta.section !== section) { section = meta.section; sideCol.appendChild(el('div', 'sechead', section)); }
    const row = el('div', 'setrow');
    const txt = el('div', 'txt', `<b>${esc(meta.label)}</b><small>${esc(meta.desc)}</small>`);
    row.appendChild(txt);
    if (meta.type === 'select') {
      const sel = el('select');
      meta.options.forEach(o => {
        const op = el('option', '', meta.key === 'turnSeconds' ? (o === 0 ? 'Off' : o + 's') : String(o));
        op.value = o; if (S.settings[meta.key] === o) op.selected = true;
        sel.appendChild(op);
      });
      sel.disabled = !!readOnly;
      sel.onchange = () => {
        if (net && net.mode === 'guest') { net.send({ type: 'setting', key: meta.key, value: +sel.value }); return; }
        S.settings[meta.key] = +sel.value;
        if (meta.key === 'startingCash') S.players.forEach(p => p.cash = +sel.value);
        renderLobby();
        if (net && net.mode === 'host') net.broadcast();
      };
      row.appendChild(sel);
    } else {
      const tg = el('button', 'sw-toggle' + (S.settings[meta.key] ? ' on' : ''));
      tg.onclick = () => {
        if (readOnly) return;
        S.settings[meta.key] = !S.settings[meta.key];
        renderLobby();
        if (net && net.mode === 'host') net.broadcast();
      };
      row.appendChild(tg);
    }
    sideCol.appendChild(row);
  });
  return sideCol;
}

/* ============================================================
   RENDER + BOOT
   ============================================================ */

function render() {
  if (S.phase === 'lobby') { renderLobby(); return; }
  syncPieces();
  renderDice(false);
  renderHUD();
  renderCardPopup();
  const ov = $('#overlay');
  if (ov && ov.dataset.live) { /* keep open modals in sync elsewhere */ }
}

function boot() {
  S = Engine.createState();
  const saved = localStorage.getItem('mogul.name');
  Engine.addPlayer(S, { name: saved || 'You', color: PLAYER_COLORS[3] });
  MY_ID = S.players[0].id;
  Sfx.init();
  Board3D.onHover = (i) => {
    if (i < 0) return hidePeek();
    const p = Board3D.lastPointer;
    if (BOARD[i].price && p) showPeekAt(i, p.x, p.y); else hidePeek();
    highlightGroup(BOARD[i].group && GROUPS[BOARD[i].group] ? BOARD[i].group : null);
  };
  Board3D.onClick = (i) => { if (BOARD[i] && BOARD[i].price) focusProperty(i); };
  applyView();
  renderLobby();
  window.addEventListener('hashchange', () => { if (!net) renderLobby(); });
  window.addEventListener('beforeunload', () => {
    const me = Engine.P(S, MY_ID);
    if (me) localStorage.setItem('mogul.name', me.name);
  });
}
</script>
<script>/* ============================================================
   MOGUL — online play over WebRTC (PeerJS)

   GitHub Pages only serves static files, so there is no server to run
   the rules. Instead the host's browser is authoritative: guests send
   actions, the host applies them with the same engine and broadcasts
   the resulting state. One link is all anyone needs.

   Host   ->  index.html          (clicks "Create online room")
   Guests ->  index.html#ABCDE    (auto-joins)
   ============================================================ */

const Net = (() => {
  const PREFIX = 'mogul-v1-';
  const CDN = 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';

  let peer = null;
  let conns = [];        // host: one per guest
  let hostConn = null;   // guest: the single link to the host
  const seatByConn = new Map();

  const api = {
    mode: null,          // 'host' | 'guest'
    code: null,
    status: 'idle',      // idle | loading | connecting | open | error
    error: '',
  };

  function loadPeerJS() {
    if (window.Peer) return Promise.resolve();
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = CDN;
      s.onload = resolve;
      s.onerror = () => reject(new Error('Could not load the connection library. Are you online?'));
      document.head.appendChild(s);
    });
  }

  function makeCode() {
    const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no O/0, no I/1
    return Array.from({ length: 5 }, () => alphabet[Math.floor(Math.random() * alphabet.length)]).join('');
  }

  function setStatus(status, error) {
    api.status = status;
    api.error = error || '';
    if (S && S.phase === 'lobby') renderLobby();
  }

  /* ---------------- host ---------------- */

  async function host() {
    try { await loadPeerJS(); } catch (e) { return setStatus('error', e.message); }
    setStatus('loading');

    const code = makeCode();
    peer = new window.Peer(PREFIX + code, { debug: 0 });

    peer.on('open', () => {
      api.mode = 'host';
      api.code = code;
      net = api;
      LOCAL_ALL = false;
      history.replaceState(null, '', '#' + code);
      setStatus('open');
    });

    peer.on('error', (err) => {
      if (err.type === 'unavailable-id') { peer.destroy(); return host(); }  // code collision, retry
      setStatus('error', friendly(err));
    });

    peer.on('connection', (conn) => {
      conn.on('open', () => conns.push(conn));
      conn.on('data', (msg) => onHostMessage(conn, msg));
      conn.on('close', () => {
        conns = conns.filter(c => c !== conn);
        const seat = seatByConn.get(conn);
        seatByConn.delete(conn);
        if (seat && S.phase === 'lobby') {
          S.players = S.players.filter(p => p.id !== seat);
          renderLobby(); broadcast();
        } else if (seat) {
          Engine.log(S, 'A player lost connection — they can rejoin with the same name');
          render(); broadcast();
        }
      });
    });
  }

  function onHostMessage(conn, msg) {
    if (msg.t === 'hello') {
      const name = String(msg.name || 'Player').slice(0, 14);
      const existing = S.players.find(p => p.name === name);
      if (S.phase !== 'lobby') {
        // rejoining an in-progress game: match the seat by name
        if (!existing) return conn.send({ t: 'refused', reason: 'The game already started.' });
        seatByConn.set(conn, existing.id);
        conn.send({ t: 'you', id: existing.id });
        return broadcast();
      }
      if (existing) return conn.send({ t: 'refused', reason: 'That name is already taken in this room.' });
      const taken = S.players.map(p => p.color);
      const color = PLAYER_COLORS.find(c => !taken.includes(c));
      if (!color || !Engine.addPlayer(S, { name, color })) {
        return conn.send({ t: 'refused', reason: 'The room is full.' });
      }
      const seat = S.players[S.players.length - 1].id;
      seatByConn.set(conn, seat);
      conn.send({ t: 'you', id: seat });
      renderLobby();
      return broadcast();
    }

    if (msg.t === 'action') {
      const seat = seatByConn.get(conn);
      if (!seat) return;
      Engine.applyAction(S, seat, msg.action);   // the host is the referee
      if (S.phase === 'lobby') renderLobby();
      else { const l = document.querySelector('#lobby'); if (l) l.remove(); render(); }
      broadcast();
    }
  }

  function broadcast() {
    const payload = { t: 'state', state: S };
    conns.forEach(c => { if (c.open) c.send(payload); });
  }

  /* ---------------- guest ---------------- */

  async function join(code, name) {
    try { await loadPeerJS(); } catch (e) { return setStatus('error', e.message); }
    api.mode = 'guest';
    api.code = code;
    net = api;
    LOCAL_ALL = false;
    setStatus('connecting');

    peer = new window.Peer({ debug: 0 });
    peer.on('error', (err) => setStatus('error', friendly(err)));

    peer.on('open', () => {
      hostConn = peer.connect(PREFIX + code, { reliable: true });
      hostConn.on('open', () => {
        setStatus('open');
        hostConn.send({ t: 'hello', name });
      });
      hostConn.on('data', (msg) => {
        if (msg.t === 'you') MY_ID = msg.id;
        if (msg.t === 'refused') setStatus('error', msg.reason);
        if (msg.t === 'state') {
          S = msg.state;
          if (S.phase === 'lobby') renderLobby();
          else { const l = document.querySelector('#lobby'); if (l) l.remove(); render(); }
        }
      });
      hostConn.on('close', () => setStatus('error', 'The host closed the room.'));
    });
  }

  function friendly(err) {
    if (err.type === 'peer-unavailable') return 'No room with that code. Check the link, or ask the host to reopen the room.';
    if (err.type === 'network' || err.type === 'server-error') return 'Connection service unreachable. Try again in a moment.';
    if (err.type === 'browser-incompatible') return 'This browser does not support peer-to-peer play.';
    return err.message || 'Connection failed.';
  }

  api.send = (action) => { if (hostConn && hostConn.open) hostConn.send({ t: 'action', action }); };
  api.broadcast = broadcast;
  api.host = host;
  api.join = join;
  api.inviteLink = () => location.origin + location.pathname + '#' + api.code;
  api.codeFromURL = () => (location.hash || '').replace('#', '').toUpperCase().slice(0, 5) || null;

  return api;
})();
</script>
<script>
/* Console handle: MOGUL.S is the live state, MOGUL.act(...) fires an action. */
window.MOGUL = {
  get S(){return S}, set S(v){S=v},
  get MY_ID(){return MY_ID}, get LOCAL_ALL(){return LOCAL_ALL},
  Engine, Net, Board3D, act,
  applyView, is3D,
  syncPieces, render, renderHUD, actorId, openTrade, closeModal, focusProperty, renderMyProperties,
  BOARD, GROUPS, PLAYER_COLORS, SETTINGS_META, Sfx,
};
boot();
</script>
