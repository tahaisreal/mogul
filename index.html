      g.fillRect(box.x, box.y, box.w, box.h);
      g.strokeStyle = PAL.line;
      g.lineWidth = 2.5;
      g.strokeRect(box.x + 1.25, box.y + 1.25, box.w - 2.5, box.h - 2.5);

      // country band, outer edge
      const band = GROUPS[t.group] ? GROUPS[t.group].color : null;
      if (band && sd !== 'corner') {
        const b = px(Layout.strip(sd, r, ZONE.band, 'outer'));
        g.fillStyle = mortgaged ? mix(band, '#8d9691', 0.55) : band;
        g.fillRect(b.x + 2, b.y + 2, b.w - 4, b.h - 4);
        g.strokeStyle = PAL.line; g.lineWidth = 2;
        g.strokeRect(b.x + 2, b.y + 2, b.w - 4, b.h - 4);
      }

      // owner bar, inner edge — never touches the country band
      if (o && sd !== 'corner') {
        const ob = px(Layout.strip(sd, r, ZONE.owner, 'inner'));
        const owner = Engine.P(S, o.by);
        g.fillStyle = mortgaged ? '#8e2f2a' : owner.color;
        g.fillRect(ob.x + 2, ob.y + 2, ob.w - 4, ob.h - 4);
        g.strokeStyle = PAL.line; g.lineWidth = 2;
        g.strokeRect(ob.x + 2, ob.y + 2, ob.w - 4, ob.h - 4);

        if (mortgaged) {
          g.save();
          g.translate(ob.x + ob.w / 2, ob.y + ob.h / 2);
          g.textAlign = 'center'; g.textBaseline = 'middle';
          const room = (sd === 'l' || sd === 'r') ? ob.h : ob.w;
          let fs = Math.min(ob.h * 0.62, room * 0.16);
          g.font = `800 ${Math.round(fs)}px Nunito, sans-serif`;
          g.fillStyle = '#ffe9e7';
          g.fillText('MORTGAGED', 0, 0);
          g.restore();
        }
      }

      if (mortgaged) {
        g.save();
        g.beginPath(); g.rect(box.x + 2, box.y + 2, box.w - 4, box.h - 4); g.clip();
        g.strokeStyle = 'rgba(120,60,50,.22)'; g.lineWidth = 10;
        for (let k = -box.h; k < box.w + box.h; k += 34) line(g, box.x + k, box.y, box.x + k + box.h, box.y + box.h);
        g.restore();
      }

      const c = px(Layout.content(sd, r));
      drawTileFace(g, i, t, sd === 'corner' ? box.x : c.x, sd === 'corner' ? box.y : c.y,
        sd === 'corner' ? box.w : c.w, sd === 'corner' ? box.h : c.h, mortgaged);
    }

    if (topTexture) topTexture.needsUpdate = true;
  }

  function line(g, x1, y1, x2, y2) {
    g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
  }

  function mix(hexA, hexB, amt) {
    const a = hexToRgb(hexA), b = hexToRgb(hexB);
    return `rgb(${Math.round(a[0] + (b[0] - a[0]) * amt)},${Math.round(a[1] + (b[1] - a[1]) * amt)},${Math.round(a[2] + (b[2] - a[2]) * amt)})`;
  }

  /* Wrap to at most two lines, shrinking until it fits the tile. */
  function wrapFit(g, text, maxW, maxPx, weight) {
    for (let px = maxPx; px >= 9; px -= 1) {
      g.font = `${weight || 700} ${px}px Nunito, "Segoe UI", system-ui, sans-serif`;
      if (g.measureText(text).width <= maxW) return { px, lines: [text] };
      const words = text.split(' ');
      if (words.length > 1) {
        for (let cut = 1; cut < words.length; cut++) {
          const l1 = words.slice(0, cut).join(' '), l2 = words.slice(cut).join(' ');
          if (g.measureText(l1).width <= maxW && g.measureText(l2).width <= maxW) {
            return { px, lines: [l1, l2] };
          }
        }
      }
    }
    g.font = `${weight || 700} 9px Nunito, sans-serif`;
    return { px: 9, lines: [text] };
  }

  function drawTileFace(g, i, t, x, y, w, h, mortgaged) {
    g.save();
    g.translate(x + w / 2, y + h / 2);
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillStyle = mortgaged ? '#5d6a66' : PAL.ink;

    const corner = { start: 'START', prison: 'IN PRISON', vacation: 'VACATION', gotoprison: 'GO TO PRISON' }[t.type];
    if (corner) {
      const icon = { start: '\u25B6\u25B6', prison: '\uD83D\uDD12', vacation: '\uD83C\uDFDD', gotoprison: '\u2620' }[t.type];
      g.font = `800 ${Math.round(h * 0.24)}px Nunito, sans-serif`;
      g.fillStyle = t.type === 'start' ? '#1f9d4e' : PAL.ink;
      g.fillText(icon, 0, -h * 0.10);
      const fit = wrapFit(g, corner, w * 0.88, Math.round(h * 0.15), 800);
      g.fillStyle = PAL.ink;
      fit.lines.forEach((ln, k) => g.fillText(ln, 0, h * 0.20 + k * fit.px * 1.05));
      g.restore();
      return;
    }

    const hasArt = t.type === 'property' ? !!flagImages[t.group] : true;
    const nameTop = hasArt ? -h * 0.26 : -h * 0.06;
    const fit = wrapFit(g, t.name, w * 0.94, Math.round(h * 0.20), 700);
    fit.lines.forEach((ln, k) => g.fillText(ln, 0, nameTop + k * fit.px * 1.06));

    if (t.type === 'property' && flagImages[t.group]) {
      const d = Math.min(w, h) * 0.36;
      g.save();
      g.beginPath(); g.arc(0, h * 0.04, d / 2, 0, Math.PI * 2); g.clip();
      g.drawImage(flagImages[t.group], -d / 2, h * 0.04 - d / 2, d, d);
      g.restore();
      g.strokeStyle = PAL.line; g.lineWidth = 2.5;
      g.beginPath(); g.arc(0, h * 0.04, d / 2, 0, Math.PI * 2); g.stroke();
    } else {
      const icon = { airport: '\u2708', utility: { power: '\u26A1', gas: '\uD83D\uDD25', water: '\uD83D\uDEB0' }[t.icon] || '\u26A1',
        tax: '\uD83D\uDCB5', surprise: '?', treasure: '\uD83E\uDDF0' }[t.type];
      if (icon) {
        g.font = `800 ${Math.round(h * 0.30)}px Nunito, sans-serif`;
        g.fillStyle = t.type === 'surprise' ? '#d6336c' : PAL.ink;
        g.fillText(icon, 0, h * 0.06);
      }
    }

    const tag = t.price ? '$' + t.price
      : (t.type === 'tax' ? (t.flat != null ? '$' + t.flat : t.percent + '%') : null);
    if (tag) {
      g.font = `800 ${Math.round(h * 0.17)}px Nunito, sans-serif`;
      g.fillStyle = mortgaged ? '#7c8783' : PAL.price;
      g.fillText(tag, 0, h * 0.36);
    }
    g.restore();
  }

  function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  /* ---------------- scene ---------------- */

  function buildScene(T) {
    THREE = T;
    scene = new T.Scene();
    scene.background = new T.Color(PAL.room);
    scene.fog = new T.Fog(PAL.room, 52, 108);

    camera = new T.PerspectiveCamera(cam.fov, 1, 0.1, 300);

    // table
    const tableTex = woodTexture(T, ['#5e3a1f', '#7a4f2c'], 6);
    tableTex.repeat.set(2.4, 2);
    const table = new T.Mesh(
      new T.BoxGeometry(46, 1.4, 40),
      new T.MeshStandardMaterial({ map: tableTex, roughness: .68, metalness: .03 }));
    table.position.y = -THICK / 2 - 0.7;
    table.receiveShadow = true;
    scene.add(table);

    // board slab
    topCanvas = document.createElement('canvas');
    topCanvas.width = topCanvas.height = TEX;
    topTexture = new T.CanvasTexture(topCanvas);
    // grazing angles are exactly where mipmaps blur; max anisotropy fixes it
    topTexture.anisotropy = renderer ? renderer.capabilities.getMaxAnisotropy() : 8;
    topTexture.minFilter = T.LinearMipmapLinearFilter;
    topTexture.magFilter = T.LinearFilter;
    topTexture.colorSpace = T.SRGBColorSpace;

    const frameTex = woodTexture(T, ['#a9763f', '#c79b62'], 0);
    frameTex.repeat.set(3, 1);
    const edge = new T.MeshStandardMaterial({ map: frameTex, roughness: .6 });
    const top = new T.MeshStandardMaterial({ map: topTexture, roughness: .58 });
    boardMesh = new T.Mesh(new T.BoxGeometry(B, THICK, B),
      [edge, edge, top, edge, edge, edge]);
    boardMesh.castShadow = true;
    boardMesh.receiveShadow = true;
    scene.add(boardMesh);

    // invisible plane used for mouse picking, sitting exactly on the surface
    pickPlane = new T.Mesh(new T.PlaneGeometry(B, B),
      new T.MeshBasicMaterial({ visible: false }));
    pickPlane.rotation.x = -Math.PI / 2;
    pickPlane.position.y = TOP + 0.001;
    scene.add(pickPlane);

    // per-tile overlay quads for hover and focus, cheaper than repainting 4MP
    overlays = [];
    for (let i = 0; i < TILES; i++) {
      const r = Layout.rect(i), c = Layout.center(i);
      const m = new T.Mesh(new T.PlaneGeometry(r.w - 0.04, r.d - 0.04),
        new T.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }));
      m.rotation.x = -Math.PI / 2;
      m.position.set(c.x, TOP + 0.012, c.z);
      m.renderOrder = 2;
      scene.add(m);
      overlays.push(m);
    }

    buildingGroup = new T.Group();
    scene.add(buildingGroup);

    buildDice(T);
    buildDecks(T);
    lights(T);
    return scene;
  }

  function lights(T) {
    scene.add(new T.AmbientLight('#ffffff', 0.52));
    scene.add(new T.HemisphereLight('#eaf2ff', '#5c3d26', 0.62));
    const key = new T.DirectionalLight('#fff4e2', 1.55);
    key.position.set(13, 27, 15);
    key.castShadow = true;
    key.shadow.mapSize.set(1024, 1024);
    key.shadow.camera.left = -20; key.shadow.camera.right = 20;
    key.shadow.camera.top = 20; key.shadow.camera.bottom = -20;
    key.shadow.camera.far = 70;
    key.shadow.bias = -0.0012;
    scene.add(key);
    const fill = new T.DirectionalLight('#cfe0ff', 0.34);
    fill.position.set(-18, 14, -12);
    scene.add(fill);
  }

  /* Procedural wood: banded grain with drifting waves, plank seams and a few
     knots. Cheaper than shipping an image and it tiles without a visible seam. */
  function woodTexture(T, tint, planks) {
    const N = 1024;
    const cv = document.createElement('canvas');
    cv.width = cv.height = N;
    const g = cv.getContext('2d');

    const base = g.createLinearGradient(0, 0, 0, N);
    base.addColorStop(0, tint[0]);
    base.addColorStop(0.5, tint[1]);
    base.addColorStop(1, tint[0]);
    g.fillStyle = base;
    g.fillRect(0, 0, N, N);

    // long grain lines
    for (let i = 0; i < 520; i++) {
      const y0 = Math.random() * N;
      const amp = 3 + Math.random() * 16;
      const freq = 1.2 + Math.random() * 2.4;
      const phase = Math.random() * Math.PI * 2;
      const dark = Math.random() < 0.62;
      g.strokeStyle = dark
        ? `rgba(48,27,12,${0.04 + Math.random() * 0.15})`
        : `rgba(214,166,113,${0.03 + Math.random() * 0.09})`;
      g.lineWidth = 0.5 + Math.random() * 2.4;
      g.beginPath();
      for (let x = 0; x <= N; x += 12) {
        const t = x / N;
        const y = y0 + Math.sin(t * Math.PI * 2 * freq + phase) * amp
                     + Math.sin(t * Math.PI * 2 * freq * 3.7 + phase) * amp * 0.28;
        if (x === 0) g.moveTo(x, y); else g.lineTo(x, y);
      }
      g.stroke();
    }

    // knots
    for (let k = 0; k < 5; k++) {
      const cx = Math.random() * N, cy = Math.random() * N;
      const rings = 5 + Math.floor(Math.random() * 5);
      for (let r = rings; r > 0; r--) {
        g.strokeStyle = `rgba(52,30,14,${0.05 + (rings - r) * 0.02})`;
        g.lineWidth = 1.4;
        g.beginPath();
        g.ellipse(cx, cy, r * 4.5, r * 2.6, Math.random() * 0.4, 0, Math.PI * 2);
        g.stroke();
      }
    }

    // plank seams
    if (planks) {
      const step = N / planks;
      for (let k = 1; k < planks; k++) {
        g.strokeStyle = 'rgba(30,17,7,.5)';
        g.lineWidth = 3;
        g.beginPath(); g.moveTo(0, k * step); g.lineTo(N, k * step); g.stroke();
        g.strokeStyle = 'rgba(225,182,132,.16)';
        g.lineWidth = 1.6;
        g.beginPath(); g.moveTo(0, k * step + 3); g.lineTo(N, k * step + 3); g.stroke();
      }
    }

    const tex = new T.CanvasTexture(cv);
    tex.colorSpace = T.SRGBColorSpace;
    tex.wrapS = tex.wrapT = T.RepeatWrapping;
    return tex;
  }

  function pipTexture(n) {
    const cv = document.createElement('canvas');
    cv.width = cv.height = 128;
    const g = cv.getContext('2d');
    g.fillStyle = '#fbfbfd'; g.fillRect(0, 0, 128, 128);
    g.fillStyle = '#1b1f1e';
    const P = { 1: [[64, 64]], 2: [[36, 36], [92, 92]], 3: [[32, 32], [64, 64], [96, 96]],
      4: [[36, 36], [92, 36], [36, 92], [92, 92]],
      5: [[34, 34], [94, 34], [64, 64], [34, 94], [94, 94]],
      6: [[36, 30], [92, 30], [36, 64], [92, 64], [36, 98], [92, 98]] }[n];
    P.forEach(([x, y]) => { g.beginPath(); g.arc(x, y, 13, 0, Math.PI * 2); g.fill(); });
    return cv;
  }

  /* face order for BoxGeometry is +x -x +y -y +z -z */
  const DIE_FACES = [1, 6, 2, 5, 3, 4];
  const DIE_UP = {                       // rotation that brings a value face-up
    1: [0, 0, Math.PI / 2], 6: [0, 0, -Math.PI / 2],
    2: [0, 0, 0],           5: [Math.PI, 0, 0],
    3: [-Math.PI / 2, 0, 0], 4: [Math.PI / 2, 0, 0],
  };

  function buildDice(T) {
    dice = [0, 1].map(k => {
      const mats = DIE_FACES.map(n => {
        const tex = new T.CanvasTexture(pipTexture(n));
        tex.colorSpace = T.SRGBColorSpace;
        return new T.MeshStandardMaterial({ map: tex, roughness: .35 });
      });
      const m = new T.Mesh(new T.BoxGeometry(1.15, 1.15, 1.15), mats);
      m.castShadow = true;
      m.position.set(k === 0 ? -1.2 : 1.2, TOP + 0.6, 0);
      scene.add(m);
      return m;
    });
  }

  function buildDecks(T) {
    const mk = (color, x, z, rot) => {
      const paper = new T.MeshStandardMaterial({ color: '#f4f6f4', roughness: .8 });
      const face = new T.MeshStandardMaterial({ color, roughness: .55 });
      const m = new T.Mesh(new T.BoxGeometry(3.1, 0.42, 2.2),
        [paper, paper, face, paper, paper, paper]);
      m.position.set(x, TOP + 0.21, z);
      m.rotation.y = rot;
      m.castShadow = true;
      scene.add(m);
    };
    mk(PAL.deckA, -4.4, -3.2, 0.30);   // surprise
    mk(PAL.deckB, 4.4, 3.2, -0.36);    // treasure
  }

  /* ---------------- pieces ---------------- */

  /* Pieces are deliberately squat: a tall pawn seen from 49 degrees paints
     itself over the tile behind it, which is where the property name lives.
     Each silhouette is real geometry so it reads from any distance.        */

  function eyes(T, g, y, z, r) {
    const white = new T.MeshStandardMaterial({ color: '#ffffff', roughness: .28 });
    const black = new T.MeshStandardMaterial({ color: '#15151d', roughness: .28 });
    [-0.13, 0.13].forEach(dx => {
      const e = new T.Mesh(new T.SphereGeometry(r, 14, 12), white);
      e.position.set(dx, y, z);
      g.add(e);
      const p = new T.Mesh(new T.SphereGeometry(r * 0.45, 10, 8), black);
      p.position.set(dx, y, z + r * 0.72);
      g.add(p);
    });
  }

  /* half-profile revolved around Y, used for the pointier silhouettes */
  function lathe(T, pts, mat, segments) {
    const v = pts.map(([x, y]) => new T.Vector2(x, y));
    const m = new T.Mesh(new T.LatheGeometry(v, segments || 24), mat);
    m.castShadow = true;
    return m;
  }

  function pawnMesh(T, color, shape) {
    const g = new T.Group();
    const mat = new T.MeshStandardMaterial({ color, roughness: .34, metalness: .04 });
    const leaf = new T.MeshStandardMaterial({ color: '#4f9b3a', roughness: .5 });
    let eyeY = 0.40, eyeZ = 0.20, eyeR = 0.115, bodyRef = null;

    if (shape === 'lemon') {
      const body = lathe(T, [[0, 0], [0.20, 0.03], [0.33, 0.16], [0.36, 0.32],
        [0.30, 0.48], [0.16, 0.58], [0, 0.62]], mat, 26);
      g.add(body);
      const tip = new T.Mesh(new T.ConeGeometry(0.07, 0.10, 10), leaf);
      tip.position.y = 0.66;
      g.add(tip);
      bodyRef = body; eyeY = 0.36; eyeZ = 0.27; eyeR = 0.10;

    } else if (shape === 'berry') {
      const body = lathe(T, [[0, 0], [0.13, 0.02], [0.28, 0.14], [0.36, 0.32],
        [0.32, 0.46], [0.18, 0.53], [0, 0.55]], mat, 26);
      g.add(body);
      const cap = new T.Mesh(new T.ConeGeometry(0.30, 0.12, 12), leaf);
      cap.position.y = 0.58;
      cap.rotation.y = Math.PI / 12;
      g.add(cap);
      bodyRef = body; eyeY = 0.32; eyeZ = 0.27; eyeR = 0.10;

    } else if (shape === 'flame') {
      const body = lathe(T, [[0, 0], [0.22, 0.05], [0.34, 0.20], [0.32, 0.40],
        [0.20, 0.58], [0.08, 0.70], [0, 0.76]], mat, 26);
      g.add(body);
      const inner = new T.Mesh(new T.SphereGeometry(0.16, 16, 12),
        new T.MeshStandardMaterial({ color: '#ffe08a', roughness: .3, emissive: '#7a4a00', emissiveIntensity: .35 }));
      inner.scale.set(1, 1.5, 1);
      inner.position.y = 0.22;
      g.add(inner);
      bodyRef = body; eyeY = 0.34; eyeZ = 0.25; eyeR = 0.095;

    } else if (shape === 'swirl') {
      const tiers = [[0.38, 0.09, 0.09], [0.29, 0.21, 0.075], [0.20, 0.32, 0.06]];
      tiers.forEach(([r, y, h]) => {
        const m = new T.Mesh(new T.SphereGeometry(r, 20, 14), mat);
        m.scale.set(1, 0.62, 1);
        m.position.y = y;
        m.castShadow = true;
        g.add(m);
        bodyRef = bodyRef || m;
      });
      const tip = new T.Mesh(new T.ConeGeometry(0.10, 0.14, 12), mat);
      tip.position.y = 0.44;
      g.add(tip);
      eyeY = 0.24; eyeZ = 0.26; eyeR = 0.10;

    } else {
      const base = new T.Mesh(new T.CylinderGeometry(0.36, 0.40, 0.16, 24), mat);
      base.position.y = 0.08;
      base.castShadow = true;
      g.add(base);
      const dome = new T.Mesh(new T.SphereGeometry(0.36, 26, 18), mat);
      dome.scale.set(1, 0.78, 1);
      dome.position.y = 0.20;
      dome.castShadow = true;
      g.add(dome);
      bodyRef = dome;
    }

    eyes(T, g, eyeY, eyeZ, eyeR);

    // Sit every silhouette exactly on the surface: the shapes have different
    // profiles, so measure rather than hand-tune each one.
    const box = new T.Box3().setFromObject(g);
    if (box.min.y < 0) g.children.forEach(c => { c.position.y -= box.min.y; });

    g.userData.body = bodyRef;
    g.userData.baseY = bodyRef ? bodyRef.position.y : 0.2;
    g.userData.shape = shape || 'blob';
    return g;
  }

  function syncPawns() {
    if (!scene) return;
    const alive = {};
    S.players.forEach(p => {
      if (p.bankrupt) return;
      alive[p.id] = true;
      const want = p.shape || 'blob';
      if (pawns[p.id] && pawns[p.id].userData.shape !== want) {
        scene.remove(pawns[p.id]);
        delete pawns[p.id];
      }
      if (!pawns[p.id]) {
        pawns[p.id] = pawnMesh(THREE, p.color, want);
        scene.add(pawns[p.id]);
        pawns[p.id].userData.tile = p.pos;
      }
    });
    Object.keys(pawns).forEach(id => {
      if (!alive[id]) { scene.remove(pawns[id]); delete pawns[id]; }
    });
    Object.entries(pawns).forEach(([id, g]) => {
      if (g.userData.walking) return;
      const p = Engine.P(S, id);
      const spot = pawnSpot(p.pos, id);
      g.position.set(spot.x, TOP, spot.z);
    });
  }

  /* spread co-located pawns so they never overlap */
  function pawnSpot(tile, playerId) {
    const here = S.players.filter(p => !p.bankrupt && p.pos === tile).map(p => p.id);
    const k = Math.max(0, here.indexOf(playerId));
    const n = Math.max(1, here.length);
    const c = Layout.center(tile), out = Layout.outward(tile);
    const cols = Math.ceil(Math.sqrt(n));
    const row = Math.floor(k / cols), col = k % cols;
    const spread = 0.38;
    const ax = out.z, az = -out.x;                 // along the tile
    const dx = (col - (Math.min(n, cols) - 1) / 2) * spread;
    const dz = (row - (Math.ceil(n / cols) - 1) / 2) * spread * 0.7;
    const inward = C * (ZONE.owner + ZONE.pawn / 2);  // park on the reserved strip
    return {
      x: c.x - out.x * inward + ax * dx - out.x * dz,
      z: c.z - out.z * inward + az * dx - out.z * dz,
    };
  }

  function syncBuildings() {
    if (!buildingGroup) return;
    while (buildingGroup.children.length) buildingGroup.remove(buildingGroup.children[0]);
    const T = THREE;
    for (const key in S.owned) {
      const i = +key, o = S.owned[i];
      if (!o.houses) continue;
      const c = Layout.center(i), out = Layout.outward(i);
      const ax = out.z, az = -out.x;
      const hotel = o.houses === 5;
      const n = hotel ? 1 : o.houses;
      for (let k = 0; k < n; k++) {
        const geo = hotel ? new T.BoxGeometry(0.78, 0.34, 0.44) : new T.BoxGeometry(0.30, 0.30, 0.30);
        const m = new T.Mesh(geo, new T.MeshStandardMaterial({
          color: hotel ? '#e0454e' : '#3fca7d', roughness: .45,
        }));
        const off = (k - (n - 1) / 2) * 0.36;
        m.position.set(
          c.x + out.x * U * 0.30 + ax * off,
          TOP + (hotel ? 0.17 : 0.15),
          c.z + out.z * U * 0.30 + az * off);
        m.castShadow = true;
        buildingGroup.add(m);
      }
    }
  }

  /* ---------------- animation ---------------- */

  const tweens = [];
  function tween(ms, onStep, onDone) {
    const t0 = performance.now();
    tweens.push({ t0, ms, onStep, onDone });
  }
  function stepTweens(now) {
    for (let k = tweens.length - 1; k >= 0; k--) {
      const t = tweens[k];
      const p = Math.min(1, (now - t.t0) / t.ms);
      t.onStep(p);
      if (p >= 1) { tweens.splice(k, 1); if (t.onDone) t.onDone(); }
    }
  }

  api.walk = function (playerId, from, to, back) {
    const g = pawns[playerId];
    if (!g) return;
    const path = [];
    let cur = from;
    const dir = back ? -1 : 1;
    let guard = 0;
    while (cur !== to && guard++ < TILES + 5) { cur = ((cur + dir) % TILES + TILES) % TILES; path.push(cur); }
    if (!path.length) return;
    g.userData.walking = true;
    let step = 0;
    const hop = () => {
      if (step >= path.length) {
        g.userData.walking = false;
        syncPawns();
        return;
      }
      const startSpot = { x: g.position.x, z: g.position.z };
      const endSpot = pawnSpot(path[step], playerId);
      tween(150, (p) => {
        g.position.x = startSpot.x + (endSpot.x - startSpot.x) * p;
        g.position.z = startSpot.z + (endSpot.z - startSpot.z) * p;
        g.position.y = TOP + Math.sin(p * Math.PI) * 0.55;
      }, () => { step++; hop(); });
    };
    hop();
  };

  api.roll = function (d1, d2) {
    if (!dice.length) return;
    [d1, d2].forEach((v, k) => {
      const m = dice[k];
      const spinX = Math.PI * (4 + Math.floor(Math.random() * 3));
      const spinZ = Math.PI * (3 + Math.floor(Math.random() * 3));
      const target = DIE_UP[v] || [0, 0, 0];
      const from = { x: m.rotation.x, y: m.rotation.y, z: m.rotation.z };
      const baseX = k === 0 ? -1.5 : 1.5;
      tween(760, (p) => {
        const e = 1 - Math.pow(1 - p, 3);
        m.rotation.x = from.x + (target[0] + spinX - from.x) * e;
        m.rotation.y = from.y + (target[1] - from.y) * e;
        m.rotation.z = from.z + (target[2] + spinZ - from.z) * e;
        m.position.y = TOP + 0.6 + Math.sin(p * Math.PI) * 2.6;
        m.position.x = baseX + (1 - e) * (k === 0 ? -2 : 2);
      }, () => {
        m.rotation.set(target[0], target[1], target[2]);
        m.position.set(baseX, TOP + 0.6, 0);
      });
    });
  };

  /* ---------------- focus / highlight ---------------- */

  let focusP = null, focusG = null;
  api.focus = function (playerId, group) {
    focusP = playerId; focusG = group;
    if (!overlays.length) return;
    const on = !!(playerId || group);
    for (let i = 0; i < TILES; i++) {
      const m = overlays[i], t = BOARD[i], o = S.owned[i];
      let hit = false;
      if (playerId && o && o.by === playerId) hit = true;
      if (group && t.group === group) hit = true;
      if (!on) { m.material.opacity = 0; continue; }
      if (hit) {
        m.material.color.set(playerId ? Engine.P(S, playerId).color : (GROUPS[group] ? GROUPS[group].color : '#ffffff'));
        m.material.opacity = 0.34;
        continue;
      }
      // Shading the rest only makes sense when picking one player's holdings
      // out of the whole board; for a country the highlight alone is enough.
      if (playerId) { m.material.color.set('#000000'); m.material.opacity = 0.62; }
      else m.material.opacity = 0;
    }
  };

  let hoverTile = -1;
  function setHover(i) {
    if (i === hoverTile) return;
    hoverTile = i;
    if (!focusP && !focusG && overlays.length) {
      overlays.forEach((m, k) => {
        m.material.color.set('#ffffff');
        m.material.opacity = k === i ? 0.16 : 0;
      });
    }
    if (api.onHover) api.onHover(i);
  }

  /* ---------------- camera + input ---------------- */

  /* Distance is derived from the viewport shape so the whole board is always
     in frame, on a wide monitor and on a phone alike. */
  function frameCamera() {
    if (!camera) return;
    const half = Math.tan((cam.fov * Math.PI / 180) / 2);
    const boardW = B * 1.06;
    const boardH = B * Math.sin(cam.el) + THICK * 2;
    // only part of the frustum is actually painted once the bar is reserved
    const needV = (boardH / 2) / (half * cam.vFrac);
    const needH = (boardW / 2) / (half * Math.max(0.35, camera.aspect));
    cam.dist = Math.max(needV, needH) * 1.1 * cam.zoom;
    applyCamera();
  }

  function applyCamera() {
    const { az, el, dist } = cam;
    camera.position.set(
      Math.cos(az) * Math.cos(el) * dist,
      Math.sin(el) * dist,
      Math.sin(az) * Math.cos(el) * dist);
    camera.lookAt(0, 0, 0);
  }

  api.resetView = function () { cam.zoom = 1; frameCamera(); };

  function bindInput(dom) {
    dom.addEventListener('pointermove', pick);
    dom.addEventListener('pointerleave', () => setHover(-1));
    dom.addEventListener('click', () => {
      if (hoverTile >= 0 && api.onClick) api.onClick(hoverTile);
    });
    // a small zoom range only — never enough to break the framing
    dom.addEventListener('wheel', (e) => {
      e.preventDefault();
      cam.zoom = Math.max(0.82, Math.min(1.2, cam.zoom + Math.sign(e.deltaY) * 0.05));
      frameCamera();
    }, { passive: false });
  }

  let ray = null, ndc = null;
  function pick(e) {
    if (!ray) { ray = new THREE.Raycaster(); ndc = new THREE.Vector2(); }
    const r = renderer.domElement.getBoundingClientRect();
    ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
    ndc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObject(pickPlane, false)[0];
    if (!hit) return setHover(-1);
    setHover(Layout.fromPoint(hit.point.x, hit.point.z));
    api.lastPointer = { x: e.clientX, y: e.clientY };
  }

  /* ---------------- lifecycle ---------------- */

  api.Layout = Layout;
  // exposed for headless verification of the scene graph
  api._build = buildScene;
  api._pawn = pawnMesh;
  api._shapes = () => SHAPES;
  api._paint = drawTexture;
  api._sync = () => { syncPawns(); syncBuildings(); };
  api._pawns = () => pawns;
  api._overlays = () => overlays;
  api._spot = pawnSpot;
  api.ready = false;
  api.error = () => loadError;

  api.mount = async function (host) {
    if (api.ready) return true;
    container = host;
    try {
      const T = await import('https://unpkg.com/three@0.185.1/build/three.module.js');
      await loadFlags();
      renderer = new T.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = T.PCFShadowMap;   // three 0.185 deprecated the soft variant and silently uses this one
      renderer.toneMapping = T.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.18;
      host.appendChild(renderer.domElement);
      renderer.domElement.style.cssText = 'width:100%;height:100%;display:block;border-radius:16px;touch-action:none;cursor:default';

      buildScene(T);
      drawTexture();
      syncPawns();
      syncBuildings();
      frameCamera();
      bindInput(renderer.domElement);
      resize();
      window.addEventListener('resize', resize);

      const loop = (now) => {
        raf = requestAnimationFrame(loop);
        stepTweens(now);
        // gentle bob on the active player's pawn
        const cur = Engine.current(S);
        Object.entries(pawns).forEach(([id, g]) => {
          const isCur = cur && cur.id === id && S.phase === 'playing';
          const b = g.userData.body;
          if (b) b.position.y = g.userData.baseY + (isCur && !g.userData.walking ? Math.sin(now / 280) * 0.07 + 0.07 : 0);
        });
        renderer.render(scene, camera);
      };
      raf = requestAnimationFrame(loop);
      api.ready = true;
      return true;
    } catch (e) {
      loadError = e.message || String(e);
      return false;
    }
  };

  function resize() {
    if (!renderer || !container) return;
    const w = container.clientWidth || 800, h = container.clientHeight || 600;
    renderer.setSize(w, h, false);
    // Render the lower slice of a taller frustum: the board lifts off the
    // bottom of the screen instead of sliding under the action bar.
    const pad = Math.min(SAFE_BOTTOM, h * 0.3);
    const fullH = h + pad;
    cam.vFrac = h / fullH;
    camera.aspect = w / fullH;
    camera.setViewOffset(w, fullH, 0, pad, w, h);
    camera.updateProjectionMatrix();
    frameCamera();
  }
  api.resize = resize;

  api.repaint = function () { if (api.ready) drawTexture(); };

  let ownedSig = null;
  api.update = function () {
    if (!api.ready) return;
    // the top texture is 4 megapixels, so only repaint it when a deed changed
    const sig = JSON.stringify(S.owned);
    if (sig !== ownedSig) { ownedSig = sig; drawTexture(); }
    syncPawns();
    syncBuildings();
    api.focus(focusP, focusG);
  };
  api.unmount = function () {
    if (raf) cancelAnimationFrame(raf);
    raf = null;
    window.removeEventListener('resize', resize);
    if (renderer) { renderer.dispose(); if (renderer.domElement.parentNode) renderer.domElement.remove(); }
    api.ready = false;
    pawns = {}; overlays = []; dice = []; scene = null;
  };

  return api;
})();

if (typeof module !== 'undefined') module.exports = { Board3D };
</script>
<script>/* ============================================================
   MOGUL — flat board (DOM)

   The same board drawn as elements instead of geometry: no WebGL, no
   texture atlas, readable on a weak laptop. It answers the exact same
   calls as Board3D — mount, update, walk, roll, focus — so the game
   never learns which one it is talking to, and only one is ever mounted.
   ============================================================ */

const Board2D = (() => {

  const api = { ready: false, lastPointer: { x: 0, y: 0 }, onHover: null, onClick: null };

  const N = PER_SIDE + 2;                 // grid tracks per edge, corners included
  const PIPS = { 1: [5], 2: [1, 9], 3: [1, 5, 9], 4: [1, 3, 7, 9], 5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9] };

  let host = null, wrap = null, boardEl = null, centerEl = null, tokensEl = null, logoEl = null;
  let tileEls = [], dieEls = [], tokenEls = {};
  let hoverTile = -1, focusP = null, focusG = null, walkTimer = null;

  /* ---------------- pure placement ---------------- */

  /* grid cell of a tile, 1-based, walking the ring clockwise from START */
  function cell(i) {
    const [c0, c1, c2, c3] = CORNER_AT;
    if (i === c0) return { r: 1, c: 1 };
    if (i < c1)   return { r: 1, c: 1 + i };
    if (i === c1) return { r: 1, c: N };
    if (i < c2)   return { r: 1 + (i - c1), c: N };
    if (i === c2) return { r: N, c: N };
    if (i < c3)   return { r: N, c: N - (i - c2) };
    if (i === c3) return { r: N, c: 1 };
    return { r: N - (i - c3), c: 1 };
  }
  api.cell = cell;

  const sideOf = (i) => Board3D.Layout.side(i);

  /* ---------------- one tile ---------------- */

  function tileNode(i) {
    const t = BOARD[i], sd = sideOf(i);
    const node = el('div', 'tile side-' + (sd === 'corner' ? 't corner' : sd));
    const { r, c } = cell(i);
    node.style.gridArea = r + ' / ' + c;
    node.dataset.i = i;

    if (t.group && GROUPS[t.group]) {
      const band = el('div', 'band');
      band.style.background = GROUPS[t.group].color;
      node.appendChild(band);
    }
    node.appendChild(el('div', 'strip'));

    const body = el('div', 'tile-body');
    if (sd === 'corner') {
      const icon = { start: '▶▶', prison: '🔒', vacation: '🏝', gotoprison: '☠' }[t.type];
      const ic = el('div', 't-icon', icon || '');
      if (t.type === 'start') ic.style.color = '#5ed17f';
      body.append(ic, el('div', 't-name', esc(t.name)));
    } else {
      body.appendChild(el('div', 't-name', esc(t.name)));
      if (t.type === 'property' && FLAGS[t.group]) {
        const f = el('div', 't-flag');
        f.innerHTML = FLAGS[t.group];
        body.appendChild(f);
      } else {
        const icon = { airport: '✈', utility: { power: '⚡', gas: '🔥', water: '🚰' }[t.icon] || '⚡',
                       tax: '💵', surprise: '?', treasure: '🧰' }[t.type];
        if (icon) {
          const ic = el('div', 't-icon', icon);
          if (t.type === 'surprise') ic.style.color = '#f472b6';
          body.appendChild(ic);
        }
      }
      const tag = t.price ? '$' + t.price
        : (t.type === 'tax' ? (t.flat != null ? '$' + t.flat : t.percent + '%') : '');
      if (tag) body.appendChild(el('div', 't-price', tag));
    }
    node.appendChild(body);
    node.appendChild(el('div', 'houses'));

    node.addEventListener('pointerenter', (e) => {
      api.lastPointer = { x: e.clientX, y: e.clientY };
      setHover(i);
    });
    node.addEventListener('pointerleave', () => setHover(-1));
    node.addEventListener('click', () => { if (api.onClick) api.onClick(i); });
    if (t.price) node.classList.add('clickable');
    return node;
  }

  function setHover(i) {
    if (i === hoverTile) return;
    hoverTile = i;
    if (api.ready) syncTiles();
    if (api.onHover) api.onHover(i);
  }

  /* ---------------- build ---------------- */

  function build() {
    wrap = el('div', '');
    wrap.id = 'flatwrap';

    boardEl = el('div', '');
    boardEl.id = 'board';
    boardEl.style.setProperty('--per', PER_SIDE);

    tileEls = [];
    for (let i = 0; i < TILES; i++) {
      const node = tileNode(i);
      tileEls[i] = node;
      boardEl.appendChild(node);
    }

    centerEl = el('div', '');
    centerEl.id = 'center';
    centerEl.style.gridArea = '2 / 2 / ' + N + ' / ' + N;
    logoEl = el('div', '', 'MO<span>GUL</span>');
    logoEl.id = 'flatlogo';
    const diceRow = el('div', '');
    diceRow.id = 'dice';
    dieEls = [0, 1].map(() => { const d = el('div', 'die'); diceRow.appendChild(d); return d; });
    centerEl.append(diceRow, logoEl);
    boardEl.appendChild(centerEl);

    tokensEl = el('div', '');
    tokensEl.id = 'tokens';
    boardEl.appendChild(tokensEl);

    wrap.appendChild(boardEl);
    host.appendChild(wrap);
    tokenEls = {};
  }

  /* ---------------- geometry of the built board ---------------- */

  /* Where a piece stands: the inner part of its tile, fanned out so several
     pieces on one tile stay countable. */
  function spot(i, playerId) {
    const node = tileEls[i];
    if (!node) return { x: 0, y: 0 };
    const w = node.offsetWidth, h = node.offsetHeight;
    const sd = sideOf(i);
    let x = node.offsetLeft + w / 2, y = node.offsetTop + h / 2;
    if (sd === 't') y = node.offsetTop + h * 0.84;
    if (sd === 'b') y = node.offsetTop + h * 0.16;
    if (sd === 'l') x = node.offsetLeft + w * 0.84;
    if (sd === 'r') x = node.offsetLeft + w * 0.16;

    const here = S.players.filter(p => p.pos === i && !p.bankrupt);
    const n = Math.max(1, here.length);
    const k = Math.max(0, here.findIndex(p => p.id === playerId));
    if (n > 1) {
      const span = Math.min(w, h) * 0.55;
      const t = (k - (n - 1) / 2) / (n - 1);
      if (sd === 'l' || sd === 'r') y += t * span; else x += t * span;
    }
    return { x, y };
  }

  function tokenNode(p) {
    const node = el('div', 'token');
    node.style.setProperty('--c', p.color);
    node.appendChild(el('div', 'tshadow'));
    const body = el('div', 'tbody shaped');
    body.innerHTML = (SHAPE_ICONS[p.shape || 'blob'] || SHAPE_ICONS.blob)(p.color)
      + '<i class="eye"></i><i class="eye"></i>';
    node.appendChild(body);
    return node;
  }

  function syncTokens() {
    const live = new Set();
    const cur = Engine.current(S);
    S.players.forEach(p => {
      if (p.bankrupt) return;
      live.add(p.id);
      let node = tokenEls[p.id];
      if (!node) { node = tokenNode(p); tokenEls[p.id] = node; tokensEl.appendChild(node); }
      node.style.setProperty('--c', p.color);
      node.classList.toggle('me', !LOCAL_ALL && p.id === MY_ID);
      node.classList.toggle('jailed', !!p.inPrison);
      node.classList.toggle('active', !!cur && cur.id === p.id);
      node.classList.toggle('hl', focusP === p.id);
      if (!node.dataset.walking) {
        const s = spot(p.pos, p.id);
        node.style.left = s.x + 'px';
        node.style.top = s.y + 'px';
      }
    });
    Object.keys(tokenEls).forEach(id => {
      if (live.has(id)) return;
      tokenEls[id].remove();
      delete tokenEls[id];
    });
  }

  function syncTiles() {
    for (let i = 0; i < TILES; i++) {
      const node = tileEls[i], o = S.owned[i], t = BOARD[i];
      const strip = node.querySelector('.strip');
      const owner = o ? Engine.P(S, o.by) : null;
      node.classList.toggle('owned', !!owner);
      if (owner) strip.style.background = owner.color;
      node.classList.toggle('mortgaged', !!(o && o.mortgaged));
      let label = node.querySelector('.mortlabel');
      if (o && o.mortgaged) {
        if (!label) { label = el('div', 'mortlabel', 'MORTGAGED'); node.appendChild(label); }
      } else if (label) label.remove();

      const houses = node.querySelector('.houses');
      const want = o && !o.mortgaged ? o.houses : 0;
      if (Number(houses.dataset.n || 0) !== want) {
        houses.dataset.n = want;
        houses.innerHTML = '';
        if (want === 5) houses.appendChild(el('div', 'hotel'));
        else for (let k = 0; k < want; k++) houses.appendChild(el('div', 'house'));
      }

      // light up what matters; shade the rest only when following one player
      const hit = (focusP && o && o.by === focusP) || (focusG && t.group === focusG);
      node.classList.toggle('hl', !!hit || (!focusP && !focusG && i === hoverTile));
      node.classList.toggle('dim', !!focusP && !hit);
      if (hit) node.style.setProperty('--own', focusP ? Engine.P(S, focusP).color : GROUPS[focusG].color);
    }
  }

  function paintDie(node, v) {
    node.innerHTML = '';
    (PIPS[v] || []).forEach(k => {
      const pip = el('i');
      pip.style.gridArea = Math.ceil(k / 3) + ' / ' + (((k - 1) % 3) + 1);
      node.appendChild(pip);
    });
  }

  /* ---------------- the shared board API ---------------- */

  api.error = () => null;

  api.mount = async function (h) {
    if (api.ready) return true;
    host = h;
    host.innerHTML = '';
    host.classList.add('flat');
    build();
    api.ready = true;
    api.resize();
    api.update();
    return true;
  };

  api.unmount = function () {
    if (walkTimer) { clearTimeout(walkTimer); walkTimer = null; }
    const hud = document.querySelector('#hud');
    if (hud) { hud.classList.remove('flatview'); hud.style.removeProperty('--barlift'); }
    if (host) { host.innerHTML = ''; host.classList.remove('flat'); }
    tileEls = []; tokenEls = {}; dieEls = [];
    hoverTile = -1; focusP = null; focusG = null;
    api.ready = false;
  };

  /* The bottom bar and the side panels float over the board, so the board
     asks for less than the window: enough that no tile hides behind them. */
  api.resize = function () {
    if (!api.ready) return;
    const size = Math.max(300, Math.min(host.clientWidth - 36, host.clientHeight - 20));
    boardEl.style.setProperty('--board', size + 'px');
    wrap.style.setProperty('--board', size + 'px');
    liftBar(size);
    fitNames();
    syncTokens();
  };

  /* Keep the action bar off the bottom row: it floats over the felt inside
     the ring instead, which is where the dice would be on a real table. */
  function liftBar(size) {
    const hud = document.querySelector('#hud');
    if (!hud) return;
    const rect = boardEl.getBoundingClientRect();
    const depth = size / (PER_SIDE + 1.42 * 2) * 1.42;
    const lift = Math.max(12, Math.round(window.innerHeight - rect.bottom + depth + 10));
    hud.classList.add('flatview');
    hud.style.setProperty('--barlift', lift + 'px');
  }

  /* A name that does not fit steps down a little rather than snapping a word
     in two. Only runs on build and resize, never per frame. */
  function fitNames() {
    tileEls.forEach((node, i) => {
      const label = node.querySelector('.t-name');
      if (!label) return;
      label.style.fontSize = '';
      const room = () => label.scrollWidth <= label.clientWidth + 0.5 && label.scrollHeight <= label.parentElement.clientHeight;
      let px = parseFloat(getComputedStyle(label).fontSize);
      let guard = 0;
      while (!room() && px > 6.5 && guard++ < 14) {
        px -= 0.5;
        label.style.fontSize = px + 'px';
      }
    });
  }

  api.update = function () {
    if (!api.ready) return;
    syncTiles();
    syncTokens();
    // no dice on the felt until someone has actually rolled
    const rolled = S.dice && S.dice[0] > 0 && S.dice[1] > 0;
    dieEls.forEach((d, k) => { d.style.display = rolled ? '' : 'none'; if (rolled) paintDie(d, S.dice[k]); });
  };

  api.repaint = api.update;
  api.resetView = function () {};

  api.roll = function (d1, d2) {
    if (!api.ready) return;
    dieEls.forEach((d, k) => {
      d.classList.remove('rolling');
      void d.offsetWidth;                       // restart the animation
      d.classList.add('rolling');
      paintDie(d, k === 0 ? d1 : d2);
      setTimeout(() => d.classList.remove('rolling'), 620);
    });
  };

  api.walk = function (playerId, from, to, back) {
    if (!api.ready) return;
    const node = tokenEls[playerId];
    if (!node) return;
    const path = [];
    let cur = from, guard = 0;
    const dir = back ? -1 : 1;
    while (cur !== to && guard++ < TILES + 5) { cur = ((cur + dir) % TILES + TILES) % TILES; path.push(cur); }
    if (!path.length) return;
    node.dataset.walking = '1';
    let step = 0;
    const hop = () => {
      if (step >= path.length) {
        delete node.dataset.walking;
        api.update();
        return;
      }
      const s = spot(path[step], playerId);
      node.style.left = s.x + 'px';
      node.style.top = s.y + 'px';
      step++;
      walkTimer = setTimeout(hop, 150);
    };
    hop();
  };

  api.focus = function (playerId, group) {
    focusP = playerId; focusG = group;
    if (api.ready) { syncTiles(); syncTokens(); }
  };

  return api;
})();
</script>
<script>/* ============================================================
   MOGUL — interface
   ============================================================ */

const $ = (sel, root = document) => root.querySelector(sel);
const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
const esc = Engine.esc;

let S = null;            // game state
let MY_ID = null;        // which seat this browser controls
let LOCAL_ALL = true;    // hot-seat: this browser plays every human seat
let net = null;          // set by net.js when online

/* Two renderers, one at a time. Board3D is geometry, Board2D is elements,
   and both answer the same calls; VIEW says which one is mounted. Nothing
   below ever names a renderer directly — that is what kept the old DOM
   fallback fighting the 3D board over hover and animation. */
let VIEW = localStorage.getItem('mogul.view') === '2d' ? '2d' : '3d';
let Board = VIEW === '2d' ? Board2D : Board3D;

function bindBoard(b) {
  b.onHover = (i) => {
    if (i < 0) return hidePeek();
    const p = b.lastPointer;
    showPeekAt(i, p ? p.x : 0, p ? p.y : 0);
  };
  b.onClick = (i) => { if (BOARD[i] && BOARD[i].price) focusProperty(i); };
}

/* Switching view unmounts the other board first, so hover, highlight and
   walk animations only ever have one owner. */
async function setView(mode) {
  if (mode === VIEW) return;
  const other = Board;
  VIEW = mode;
  localStorage.setItem('mogul.view', mode);
  Board = mode === '2d' ? Board2D : Board3D;
  if (other && other.ready) other.unmount();
  const ok = await applyView();
  if (!ok) return;
  if (S.phase !== 'lobby') render(); else renderLobby();
  renderHUD();
}

let walkSeq = -1;

function reduceMotion() {
  return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

function renderDice(animate) {
  if (animate && Board.ready) { Board.roll(S.dice[0], S.dice[1]); Sfx.dice(); }
}

function syncPieces() {
  if (!Board.ready) return;
  Board.update();
  const lm = S.lastMove;
  if (lm && lm.seq !== walkSeq) {
    walkSeq = lm.seq;
    if (lm.walk && !reduceMotion() && lm.from !== lm.to) {
      Board.walk(lm.player, lm.from, lm.to, lm.back);
      const hops = Math.min(12, ((lm.to - lm.from) % TILES + TILES) % TILES);
      for (let k = 0; k < hops; k++) setTimeout(Sfx.step, k * 150);
      setTimeout(Sfx.land, hops * 150);
    } else if (!lm.walk) {
      Sfx.jail();
    }
  }
}

/* ---------- hover focus ---------- */

let focusPlayer = null, focusGroup = null;

function highlightPlayer(id) { focusPlayer = id; applyHighlight(); }
function highlightGroup(g) { focusGroup = g; applyHighlight(); }
function applyHighlight() { if (Board.ready) Board.focus(focusPlayer, focusGroup); }

/* ---------- property peek card ---------- */
function showPeek(i, node) {
  const t = BOARD[i];
  if (!t.price) return hidePeek();
  const peek = $('#peek');
  const o = S.owned[i];
  let rows = '';

  if (t.type === 'property') {
    const labels = ['with rent', 'with one house', 'with two houses', 'with three houses', 'with four houses', 'with a hotel'];
    rows = t.rent.map((r, k) => {
      const hl = o && o.houses === k ? ' class="hl"' : (!o && k === 0 ? ' class="hl"' : '');
      return `<tr${hl}><td>${labels[k]}</td><td>$${r}</td></tr>`;
    }).join('');
  } else if (t.type === 'airport') {
    rows = t.rent.map((r, k) => {
      const n = o ? Engine.countOwned(S, o.by, 'AIR') : 0;
      return `<tr${n === k + 1 ? ' class="hl"' : ''}><td>${k + 1} airport${k ? 's' : ''} owned</td><td>$${r}</td></tr>`;
    }).join('');
  } else {
    rows = `<tr><td>1 utility owned</td><td>4 &times; dice</td></tr><tr><td>2 utilities owned</td><td>10 &times; dice</td></tr>`;
  }

  const houseCost = t.type === 'property' ? GROUPS[t.group].house : null;
  peek.innerHTML = `
    <div class="ph">${t.group && FLAGS[t.group] ? `<span class="t-flag">${FLAGS[t.group]}</span>` : ''}${esc(t.name)}</div>
    <table><tr><th>when</th><th>get</th></tr>${rows}</table>
    <div class="pf">
      ${o ? `Owner &nbsp;<span class="ltag"><i style="background:${Engine.P(S, o.by).color}"></i>${esc(Engine.P(S, o.by).name)}</span><br>` : ''}
      Price $${t.price}${houseCost ? ` &nbsp;·&nbsp; 🏠 $${houseCost} &nbsp;·&nbsp; 🏨 $${houseCost}` : ''}
      ${o && o.mortgaged ? '<br><b style="color:var(--bad)">Mortgaged</b>' : ''}
    </div>`;
  const r = node.getBoundingClientRect();
  let x = r.left + r.width / 2 - 115, y = r.top + r.height + 8;
  if (y + 260 > window.innerHeight) y = r.top - 268;
  peek.style.left = Math.max(8, Math.min(x, window.innerWidth - 240)) + 'px';
  peek.style.top = Math.max(8, y) + 'px';
  peek.classList.add('on');
}
function hidePeek() { $('#peek').classList.remove('on'); }

/* same card, positioned at the cursor instead of against a DOM tile */
function showPeekAt(i, px, py) {
  showPeek(i, { getBoundingClientRect: () => ({ left: px, top: py, width: 0, height: 0 }) });
}

/* ============================================================
   SIDE PANEL
   ============================================================ */

const lastCash = {};

function renderHUD() {
  const players = $('#hudPlayers'), props = $('#hudProps');
  const logSlot = $('#hudLog'), bar = $('#hudBar'), prompt = $('#hudPrompt');
  if (!players) return;
  [players, props, logSlot, bar, prompt].forEach(n => n.innerHTML = '');

  renderPlayerPanel(players);
  renderChatPanel(logSlot);
  renderLogPanel(logSlot);
  renderMyProperties(props);
  renderTradePanel(props);
  renderBar(bar);
  renderPrompt(prompt);
}

function avatarNode(p) {
  const a = el('div', 'pav', SHAPE_ICONS[p.shape || 'blob'](p.color));
  return a;
}

function renderPlayerPanel(slot) {
  // hosts keep the invite handy: latecomers and reconnects both need it
  if (net && net.mode === 'host') {
    const chip = el('div', 'card roomchip');
    const peers = Net.peerCount ? Net.peerCount() : 0;
    chip.appendChild(el('div', 'roomcode',
      `Room <b>${esc(Net.short())}</b><span class="pmeta"> · ${peers} connected</span>`));
    const copy = el('button', 'btn', 'Copy invite link');
    copy.onclick = async () => {
      const link = Net.inviteLink();
      try { await navigator.clipboard.writeText(link); } catch { toast(link); }
      copy.textContent = 'Copied ✓';
      Sfx.click();
      setTimeout(() => copy.textContent = 'Copy invite link', 1600);
    };
    chip.appendChild(copy);
    slot.appendChild(chip);
  } else if (net && net.mode === 'guest') {
    const chip = el('div', 'card roomchip');
    chip.appendChild(el('div', 'roomcode', `Room <b>${esc(Net.short())}</b>`));
    slot.appendChild(chip);
  }

  const card = el('div', 'card');
  S.order.forEach(id => {
    const p = Engine.P(S, id);
    const cur = Engine.current(S);
    const row = el('div', 'prow' + (cur && cur.id === id ? ' active' : '') + (p.bankrupt ? ' dead' : ''));
    row.appendChild(avatarNode(p));
    row.appendChild(el('div', 'pname',
      `${esc(p.name)}${p.id === MY_ID ? ' <span class="pmeta">you</span>' : ''}${p.inPrison ? ' ⛓' : ''}${p.jailCards ? ' 🎟'.repeat(p.jailCards) : ''}`));
    const badge = teamBadge(id);
    if (badge) row.appendChild(badge);
    row.appendChild(el('div', 'pcash', `$${p.cash}`));
    const owns = Object.keys(S.owned).filter(k => S.owned[k].by === id).length;
    if (owns) row.appendChild(el('div', 'powns', `${owns}`));
    row.title = `Net worth $${Engine.netWorth(S, id)}`;
    row.addEventListener('mouseenter', () => highlightPlayer(id));
    row.addEventListener('mouseleave', () => highlightPlayer(null));

    const was = lastCash[id];
    if (was != null && was !== p.cash && S.phase === 'playing') {
      const d = p.cash - was;
      if (id === MY_ID || LOCAL_ALL) (d > 0 ? Sfx.cashIn : Sfx.cashOut)();
      const f = el('div', 'cashfly ' + (d > 0 ? 'up' : 'down'), (d > 0 ? '+' : '−') + '$' + Math.abs(d));
      row.appendChild(f);
      setTimeout(() => f.remove(), 1500);
    }
    lastCash[id] = p.cash;
    card.appendChild(row);
  });
  slot.appendChild(card);
}

/* Chat only exists online — around one screen you just talk. The team
   channel hides your plotting from the other side's screen; it is not
   secrecy from the host, whose browser runs the whole game. */
let chatDraft = '', chatScope = 'all', chatFocused = false;

function renderChatPanel(slot) {
  if (!net || S.phase === 'lobby') return;
  const mine = myTeam();
  if (chatScope === 'team' && !mine) chatScope = 'all';

  const card = el('div', 'card chatcard');

  if (mine) {
    const tabs = el('div', 'chattabs');
    const mk = (key, label) => {
      const b = el('button', chatScope === key ? 'sel' : '', label);
      b.onclick = () => { chatScope = key; renderHUD(); };
      return b;
    };
    tabs.append(mk('all', 'Everyone'), mk('team', `${mine.emoji} ${esc(mine.name)}`));
    card.appendChild(tabs);
  }

  const log = el('div', 'chatlog');
  const visible = S.chat.filter(m => (m.team ? (mine && m.team === mine.id) : true));
  const shown = visible.filter(m => chatScope === 'team' ? !!m.team : !m.team).slice(-40);
  if (!shown.length) {
    log.appendChild(el('div', 'chatline', chatScope === 'team'
      ? '<span class="pmeta">Only your team sees this channel.</span>'
      : '<span class="pmeta">Say something to the table.</span>'));
  }
  shown.forEach(m => {
    const p = Engine.P(S, m.by);
    const line = el('div', 'chatline' + (m.team ? ' team' : ''),
      `<b style="color:${p ? p.color : '#fff'}">${esc(p ? p.name : '?')}</b> ${esc(m.text)}`);
    log.appendChild(line);
  });
  card.appendChild(log);

  const row = el('div', 'chatrow');
  const inp = el('input');
  inp.type = 'text'; inp.maxLength = 220;
  inp.placeholder = chatScope === 'team' ? 'Message your team…' : 'Message everyone…';
  inp.value = chatDraft;
  inp.oninput = () => { chatDraft = inp.value; };
  inp.onfocus = () => { chatFocused = true; };
  inp.onblur = () => { chatFocused = false; };
  const send = () => {
    const text = inp.value.trim();
    if (!text) return;
    act({ type: 'chat', text, scope: chatScope });
    chatDraft = ''; inp.value = '';
  };
  inp.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); send(); } };
  const go = el('button', 'btn primary', '➤');
  go.onclick = send;
  row.append(inp, go);
  card.appendChild(row);

  slot.appendChild(card);
  log.scrollTop = log.scrollHeight;
  // a broadcast repaints the HUD mid-sentence, so give the caret back
  if (chatFocused) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
}

function renderLogPanel(slot) {
  const card = el('div', 'card');
  const box = el('div', 'logbox');
  S.log.slice(-9).forEach(l => {
    const line = el('div', '', l.html);
    if (l.meta && l.meta.kind === 'trade') {
      const ref = line.querySelector('.lref');
      if (ref) {
        ref.classList.add('live');
        ref.addEventListener('mouseenter', () => showTradeTip(ref, l.meta.trade));
        ref.addEventListener('mouseleave', hideTradeTip);
      }
    }
    box.appendChild(line);
  });
  card.appendChild(box);
  slot.appendChild(card);
}

/* the word "trade" in the log opens the exact terms that were offered */
function showTradeTip(anchor, t) {
  let tip = $('#tradetip');
  if (!tip) { tip = el('div'); tip.id = 'tradetip'; document.body.appendChild(tip); }
  const from = Engine.P(S, t.from), to = Engine.P(S, t.to);
  if (!from || !to) return;
  tip.innerHTML = `
    <div class="tthead">
      <span class="ltag"><i style="background:${from.color}"></i>${esc(from.name)}</span>
      <span class="tarrow">→</span>
      <span class="ltag"><i style="background:${to.color}"></i>${esc(to.name)}</span>
    </div>
    <div class="ttline"><span class="tclabel give">${esc(from.name)} gave</span> ${bagHTML(t.give)}</div>
    <div class="ttline"><span class="tclabel get">${esc(to.name)} gave</span> ${bagHTML(t.want)}</div>
    ${t.note ? `<div class="tcnote">“${esc(t.note)}”</div>` : ''}`;
  const r = anchor.getBoundingClientRect();
  tip.style.left = Math.min(r.left, window.innerWidth - 300) + 'px';
  tip.style.top = Math.max(8, r.top - 8) + 'px';
  tip.classList.add('on');
}
function hideTradeTip() { const t = $('#tradetip'); if (t) t.classList.remove('on'); }

function renderTradePanel(slot) {
  if (!S.trades.length) return;
  const c = el('div', 'card');
  c.appendChild(el('h3', '', `Open trades (${S.trades.length})`));
  S.trades.forEach(t => c.appendChild(tradeCard(t)));
  slot.appendChild(c);
}

/* Bottom bar: whose turn it is, the roll/end action, and the tools. */
function renderBar(slot) {
  const card = el('div', 'card');
  const cur = Engine.current(S);

  const line = el('div', 'turnline');
  if (S.phase === 'ended') {
    const w = Engine.P(S, S.winner);
    const wt = S.winnerTeam ? Engine.findTeam(S, S.winnerTeam) : null;
    if (!renderBar.celebrated) { renderBar.celebrated = true; Sfx.win(); }
    line.innerHTML = wt
      ? `🏆 ${wt.emoji} <b>${esc(wt.name)}</b> wins together!`
      : `🏆 <b>${w ? esc(w.name) : '—'}</b> wins!`;
  } else if (cur) {
    line.innerHTML = `<span class="ltag"><i style="background:${cur.color}"></i>${esc(cur.name)}</span>
      ${cur.id === actorId() ? '— your move' : 'is playing…'}`;
  }
  card.appendChild(line);

  const row = el('div', 'barrow');
  const acting = actorId();
  const isMine = cur && cur.id === acting;

  if (S.phase === 'ended') {
    const again = el('button', 'btn primary big', '↻ New game');
    again.onclick = () => location.reload();
    row.appendChild(again);
  } else if (!S.pending && isMine) {
    if (cur.inPrison && !S.rolled) {
      const r = el('button', 'btn primary big', '🎲 Roll for doubles');
      r.onclick = doRoll; row.appendChild(r);
      const bail = el('button', 'btn', 'Pay $50 bail');
      bail.onclick = () => act({ type: 'payBail' });
      if (cur.cash < 50) bail.disabled = true;
      row.appendChild(bail);
      if (cur.jailCards) {
        const j = el('button', 'btn good', 'Use free pass 🎟');
        j.onclick = () => act({ type: 'useJailCard' });
        row.appendChild(j);
      }
    } else if (!S.rolled) {
      const r = el('button', 'btn primary big', '🎲 Roll dice');
      r.onclick = doRoll; row.appendChild(r);
    } else {
      const e = el('button', 'btn good big', 'End turn ➜');
      e.onclick = () => act({ type: 'endTurn' });
      row.appendChild(e);
    }
  }

  const tools = el('div', 'tools');
  const bTrade = el('button', 'btn', '⇄ Trades');
  bTrade.onclick = () => openTrade();
  const bSound = el('button', 'btn', Sfx.muted ? '🔇 Sound' : '🔊 Sound');
  bSound.onclick = () => { Sfx.setMuted(!Sfx.muted); Sfx.click(); renderHUD(); };
  const bView = el('button', 'btn', VIEW === '2d' ? '🧊 3D board' : '🀫 Flat board');
  bView.title = VIEW === '2d' ? 'Switch to the 3D board' : 'Switch to the flat 2D board';
  bView.onclick = () => { Sfx.click(); setView(VIEW === '2d' ? '3d' : '2d'); };
  tools.append(bTrade, bSound, bView);
  row.appendChild(tools);

  card.appendChild(row);
  slot.appendChild(card);
}

/* Anything that needs a decision appears in the middle of the screen. */
function renderPrompt(slot) {
  const pd = S.pending;
  if (!pd || S.phase !== 'playing') return;
  const acting = actorId();

  const box = el('div', 'prompt');
  const row = el('div', 'promptRow');

  if (pd.kind === 'buy' && pd.player === acting) {
    const t = BOARD[pd.tile];
    box.appendChild(el('div', 'promptTitle', esc(t.name)));
    box.appendChild(el('div', 'promptSub',
      `Unowned — yours for <span class="promptPrice">$${t.price}</span>`));
    const buy = el('button', 'btn good big', `Buy for $${t.price}`);
    buy.onclick = () => act({ type: 'buy' });
    if (Engine.P(S, acting).cash < t.price) buy.disabled = true;
    const skip = el('button', 'btn', S.settings.auction ? 'Send to auction' : 'Skip');
    skip.onclick = () => act({ type: 'skipBuy' });
    row.append(buy, skip);
  } else if (pd.kind === 'auction') {
    const t = BOARD[pd.tile];
    const bidder = pd.bidders[pd.turnIdx % pd.bidders.length];
    box.appendChild(el('div', 'promptTitle', `Auction — ${esc(t.name)}`));
    box.appendChild(el('div', 'promptSub',
      `Highest bid <span class="promptPrice">$${pd.bid}</span>${pd.leader ? ' by ' + esc(Engine.P(S, pd.leader).name) : ''}`));
    if (bidder !== acting) {
      box.appendChild(el('div', 'pmeta', `Waiting for ${esc(Engine.P(S, bidder).name)}…`));
    } else {
      [10, 50, 100].forEach(inc => {
        const b = el('button', 'btn', `+$${inc}`);
        b.onclick = () => act({ type: 'bid', amount: pd.bid + inc });
        if (Engine.P(S, acting).cash < pd.bid + inc) b.disabled = true;
        row.appendChild(b);
      });
      const p = el('button', 'btn bad', 'Pass');
      p.onclick = () => act({ type: 'passBid' });
      row.appendChild(p);
    }
  } else if (pd.kind === 'debt' && pd.player === acting) {
    box.appendChild(el('div', 'promptTitle', `You owe $${pd.amount}`));
    box.appendChild(el('div', 'promptSub',
      `Sell buildings${S.settings.mortgage ? ' or mortgage property' : ''} to cover it.`));
    const jump = el('button', 'btn primary', '↓ Open my properties');
    jump.onclick = () => {
      scrollTo(document.querySelector('#hudProps .card.props'));
      const first = document.querySelector('.proprow .mini:not([disabled])');
      if (first) { first.focus(); first.closest('.proprow').classList.add('flash'); }
    };
    const fold = el('button', 'btn bad', 'Declare bankruptcy');
    fold.onclick = () => act({ type: 'declareBankrupt' });
    if (Engine.liquidValue(S, acting) >= pd.amount) fold.disabled = true;
    row.append(jump, fold);
  } else {
    return;
  }

  box.appendChild(row);
  slot.appendChild(box);
}

function is3D() { return Board === Board3D && Board3D.ready; }

/* ---------- teams ---------- */

function myTeam() {
  const me = MY_ID ? Engine.P(S, MY_ID) : (S.players[0] || null);
  return me && me.team ? Engine.findTeam(S, me.team) : null;
}

/* The little coloured pill that says who someone is playing with. */
function teamBadge(playerId) {
  if (!S.settings.teams) return null;
  const t = Engine.findTeam(S, Engine.teamOf(S, playerId));
  if (!t) return null;
  const b = el('span', 'tbadge', `${t.emoji} ${esc(t.name)}`);
  b.style.setProperty('--tcol', t.color);
  return b;
}

window.addEventListener('resize', () => { if (Board === Board2D && Board2D.ready) Board2D.resize(); });

async function applyView() {
  const host = $('#scene');
  if (Board.ready) { Board.resize(); Board.update(); return true; }
  host.classList.remove('failed');
  if (Board === Board3D) host.classList.add('loading');
  const ok = await Board.mount(host);
  host.classList.remove('loading');
  if (!ok) {
    // No WebGL is not a dead end any more: the flat board needs none.
    const why = Board3D.error() || 'WebGL is unavailable.';
    VIEW = '2d';
    localStorage.setItem('mogul.view', '2d');
    Board = Board2D;
    await Board2D.mount(host);
    toast('3D unavailable — switched to the flat board');
    Engine.log(S, 'The 3D board could not start (' + esc(why) + ') — playing on the flat board');
  }
  if (S.phase !== 'lobby') render();
  return true;
}

function actorId() {
  // hot-seat: this browser acts as whoever the game is waiting on
  if (!LOCAL_ALL) return MY_ID;
  const pd = S.pending;
  if (pd) {
    if (pd.kind === 'auction') return pd.bidders[pd.turnIdx % pd.bidders.length];
    if (pd.player) return pd.player;
  }
  const c = Engine.current(S);
  return c ? c.id : MY_ID;
}

function renderActions(box) {
  box.innerHTML = '';
  if (S.phase !== 'playing') return;
  const cur = Engine.current(S);
  const acting = actorId();
  const isMine = cur && cur.id === acting;

  const add = (label, cls, fn, disabled) => {
    const b = el('button', 'btn ' + (cls || ''), label);
    b.onclick = fn; if (disabled) b.disabled = true;
    box.appendChild(b); return b;
  };

  const pd = S.pending;

  if (pd && pd.kind === 'debt' && pd.player === acting) {
    box.appendChild(el('div', '', `<b style="color:var(--bad)">You owe $${pd.amount}.</b> Sell buildings${S.settings.mortgage ? ' or mortgage' : ''} to cover it.`));
    const jump = el('button', 'btn primary', '↓ Sell from my properties');
    jump.onclick = () => {
      scrollTo(document.querySelector('#hudProps .card.props'));
      const first = document.querySelector('.proprow .mini:not([disabled])');
      if (first) { first.focus(); first.closest('.proprow').classList.add('flash'); }
    };
    box.appendChild(jump);
    const rescue = Engine.liquidValue(S, acting);
    add('Declare bankruptcy', 'bad', () => act({ type: 'declareBankrupt' }), rescue >= pd.amount);
    return;
  }

  if (pd && pd.kind === 'buy' && pd.player === acting) {
    const t = BOARD[pd.tile];
    box.appendChild(el('div', '', `<b>${esc(t.name)}</b> is unowned — $${t.price}`));
    add(`Buy for $${t.price}`, 'good', () => act({ type: 'buy' }), Engine.P(S, acting).cash < t.price);
    add(S.settings.auction ? 'Send to auction' : 'Skip', '', () => act({ type: 'skipBuy' }));
    return;
  }

  if (pd && pd.kind === 'auction') {
    renderAuction(box, pd);
    return;
  }

  if (!isMine) {
    box.appendChild(el('div', 'pmeta', cur ? `Waiting for ${esc(cur.name)}…` : ''));
    return;
  }

  if (cur.inPrison && !S.rolled) {
    add('🎲 Roll for doubles', 'primary', () => doRoll());
    add('Pay $50 bail', '', () => act({ type: 'payBail' }), cur.cash < 50);
    if (cur.jailCards) add('Use free pass 🎟', 'good', () => act({ type: 'useJailCard' }));
    return;
  }

  if (!S.rolled) add('🎲 Roll dice', 'primary', () => doRoll());
  else add('End turn ➜', 'good', () => act({ type: 'endTurn' }));
}

function renderAuction(box, au) {
  const t = BOARD[au.tile];
  const bidder = au.bidders[au.turnIdx];
  box.appendChild(el('div', '', `<b>Auction — ${esc(t.name)}</b><br>
    Highest bid: <span class="money">$${au.bid}</span> ${au.leader ? 'by ' + esc(Engine.P(S, au.leader).name) : ''}`));
  const acting = actorId();
  if (bidder !== acting) { box.appendChild(el('div', 'pmeta', `Waiting for ${esc(Engine.P(S, bidder).name)}…`)); return; }
  [10, 50, 100].forEach(inc => {
    const b = el('button', 'btn', `+$${inc}`);
    b.onclick = () => act({ type: 'bid', amount: au.bid + inc });
    if (Engine.P(S, acting).cash < au.bid + inc) b.disabled = true;
    box.appendChild(b);
  });
  const p = el('button', 'btn bad', 'Pass'); p.onclick = () => act({ type: 'passBid' }); box.appendChild(p);
}

/* ============================================================
   ACTIONS
   ============================================================ */

const SOUND_FOR = {
  buy: 'buy', build: 'build', sellHouse: 'build',
  mortgage: 'cashIn', unmortgage: 'cashOut',
  proposeTrade: 'trade', endTurn: 'turn',
  payBail: 'cashOut', useJailCard: 'cashIn',
  bid: 'click', passBid: 'click', declareBankrupt: 'bad',
};

function act(action, who) {
  const id = who || actorId();
  const cue = SOUND_FOR[action.type];
  if (cue && Sfx[cue]) Sfx[cue]();
  if (action.type === 'respondTrade') (action.accept ? Sfx.trade : Sfx.click)();
  if (net && net.mode === 'guest') { net.send(action); return; }
  Engine.applyAction(S, id, action);
  afterAction();
  if (net && net.mode === 'host') net.broadcast();
}

function doRoll() {
  act({ type: 'roll' });
  renderDice(true);
}

function afterAction() {
  render();
}

/* ============================================================
   MODALS
   ============================================================ */

function modal(title, sub, bodyNode, wide) {
  closeModal();
  const ov = el('div', 'overlay'); ov.id = 'overlay';
  const m = el('div', 'modal');
  if (wide) m.style.width = 'min(760px,95vw)';
  m.style.position = 'relative';
  const x = el('button', 'x', '✕'); x.onclick = closeModal;
  m.append(x, el('h2', '', title));
  if (sub) m.appendChild(el('div', 'sub', sub));
  m.appendChild(bodyNode);
  ov.appendChild(m);
  ov.addEventListener('click', e => { if (e.target === ov) closeModal(); });
  document.body.appendChild(ov);
}
function closeModal() { const o = $('#overlay'); if (o) o.remove(); }

/* ---------- my properties ----------
   Always on screen in the sidebar: owning things is the whole game, so it
   should never be hidden behind a button.                                */

function propertyRow(i, owner) {
  const t = BOARD[i], o = S.owned[i];
  const row = el('div', 'proprow');
  row.dataset.tile = i;

  const swatch = el('span', 'propdot');
  swatch.style.background = GROUPS[t.group] ? GROUPS[t.group].color : '#9a8b7a';
  const label = el('div', 'propname', esc(t.name));
  if (o.houses === 5) label.appendChild(el('span', 'propb', '🏨'));
  else if (o.houses) label.appendChild(el('span', 'propb', '🏠'.repeat(o.houses)));
  if (o.mortgaged) label.appendChild(el('span', 'propm', 'mortgaged'));
  row.append(swatch, label);

  row.addEventListener('mouseenter', () => highlightGroup(t.group && GROUPS[t.group] ? t.group : null));
  row.addEventListener('mouseleave', () => highlightGroup(null));

  const acts = el('div', 'propacts');
  if (t.type === 'property') {
    const cost = GROUPS[t.group].house;
    const up = el('button', 'mini good', `+🏠 $${cost}`);
    up.onclick = () => act({ type: 'build', tile: i }, owner);
    if (!Engine.canBuild(S, owner, i)) up.disabled = true;
    const down = el('button', 'mini', `−🏠 $${Math.floor(cost / 2)}`);
    down.onclick = () => act({ type: 'sellHouse', tile: i }, owner);
    if (!Engine.canSell(S, owner, i)) down.disabled = true;
    acts.append(up, down);
  }
  if (S.settings.mortgage) {
    const m = el('button', 'mini bad',
      o.mortgaged ? `Lift $${Math.ceil(t.price * 0.55)}` : `Mortgage $${Math.floor(t.price / 2)}`);
    m.onclick = () => act({ type: o.mortgaged ? 'unmortgage' : 'mortgage', tile: i }, owner);
    acts.appendChild(m);
  }
  if (acts.children.length) row.appendChild(acts);
  return row;
}

function renderMyProperties(side) {
  const me = actorId();
  const mine = Object.keys(S.owned).map(Number).filter(i => S.owned[i].by === me).sort((a, b) => a - b);

  const card = el('div', 'card props');
  card.appendChild(el('h3', '', `My properties (${mine.length})`));

  if (!mine.length) {
    card.appendChild(el('div', 'empty', 'Nothing yet. Land on a free tile and buy it.'));
    side.appendChild(card);
    return;
  }

  const byGroup = {};
  mine.forEach(i => { const g = BOARD[i].group; (byGroup[g] = byGroup[g] || []).push(i); });

  Object.entries(byGroup).forEach(([g, tiles]) => {
    const label = GROUPS[g] ? GROUPS[g].name : (g === 'AIR' ? 'Airports' : 'Utilities');
    const full = GROUPS[g] ? Engine.ownsFullSet(S, me, g) : false;
    // with teams the set that matters is the team's, so count theirs
    const held = S.settings.teams ? Engine.countOwned(S, me, g) : tiles.length;
    const shared = held > tiles.length ? ' <span class="pmeta">(with your team)</span>' : '';
    const head = el('div', 'propgroup' + (full ? ' full' : ''),
      `${esc(label)}${full ? ' <span class="setflag">full set</span>' : ` <span class="pmeta">${held}/${Engine.groupTiles(g).length}</span>${shared}`}`);
    card.appendChild(head);
    tiles.forEach(i => card.appendChild(propertyRow(i, me)));
  });

  side.appendChild(card);
}

/* clicking a tile on the board points at its row instead of opening a dialog */
/* not every environment implements smooth scrolling */
function scrollTo(node) {
  if (node && typeof node.scrollIntoView === 'function') {
    try { node.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch { node.scrollIntoView(); }
  }
}

function focusProperty(i) {
  const row = document.querySelector(`.proprow[data-tile="${i}"]`);
  if (!row) { toast(BOARD[i].name + ' is not yours'); return; }
  scrollTo(row);
  row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash');
}

/* ---------- trade ----------
   Two rules drive this UI, both aimed at the misclick problem:
   direction is never implied (each side is labelled and colour-coded),
   and anything irreversible needs a second, differently-worded click.   */

function tileChipHTML(i) {
  const t = BOARD[i];
  const c = GROUPS[t.group] ? GROUPS[t.group].color : '#8b8bb0';
  return `<span class="tchip"><i style="background:${c}"></i>${esc(t.name)}</span>`;
}

function bagHTML(bag) {
  const bits = [];
  if (bag.cash) bits.push(`<span class="money">$${bag.cash}</span>`);
  bag.tiles.forEach(i => bits.push(tileChipHTML(i)));
  return bits.length ? bits.join(' ') : '<span class="pmeta">nothing</span>';
}

function openTrade(preselect) {
  const me = actorId();
  const others = S.players.filter(p => p.id !== me && !p.bankrupt);
  if (!others.length) { toast('No one to trade with'); return; }

  let target = preselect || null;
  const give = { cash: 0, tiles: [] };
  const want = { cash: 0, tiles: [] };
  const body = el('div');
  body.dataset.note = '';

  function pickStep() {
    body.innerHTML = '';
    body.appendChild(el('div', 'sechead', 'Who do you want to trade with?'));
    others.forEach(p => {
      const b = el('button', 'pickrow');
      const av = el('div', 'pav', '<div class="eye"></div><div class="eye"></div>');
      av.style.background = p.color;
      const props = Object.keys(S.owned).filter(i => S.owned[i].by === p.id).length;
      b.append(av, el('span', 'pname', esc(p.name)),
        el('span', 'pmeta', `$${p.cash} · ${props} propert${props === 1 ? 'y' : 'ies'}`));
      b.onclick = () => { target = p.id; buildStep(); };
      body.appendChild(b);
    });
    modalTitle('Create a trade', 'Pick a player first.');
  }

  function assetPicker(pid, bag, onChange) {
    const p = Engine.P(S, pid);
    const wrap = el('div', 'picker');

    const cash = el('div', 'cashctl');
    const range = el('input');
    range.type = 'range'; range.className = 'slider';
    range.min = 0; range.max = Math.max(0, p.cash); range.step = 5; range.value = bag.cash;
    const num = el('input');
    num.type = 'number'; num.className = 'cashnum';
    num.min = 0; num.max = Math.max(0, p.cash); num.value = bag.cash;

    const sync = (v) => {
      bag.cash = Math.max(0, Math.min(p.cash, Math.round(v) || 0));
      range.value = bag.cash; num.value = bag.cash;
      onChange();
    };
    range.oninput = () => sync(+range.value);
    num.oninput = () => sync(+num.value);

    const quick = el('div', 'quick');
    [['0', 0], ['¼', .25], ['½', .5], ['Max', 1]].forEach(([lbl, f]) => {
      const b = el('button', 'mini', lbl);
      b.onclick = () => sync(p.cash * f);
      quick.appendChild(b);
    });
    const row = el('div', 'cashrow');
    row.append(el('span', 'cashlabel', '$'), num, quick);
    cash.append(range, row);
    wrap.appendChild(cash);

    const tiles = Object.keys(S.owned).map(Number)
      .filter(i => S.owned[i].by === pid && !S.owned[i].houses)
      .sort((a, b) => a - b);

    if (!tiles.length) {
      wrap.appendChild(el('div', 'empty',
        Object.keys(S.owned).some(i => S.owned[i].by === pid)
          ? 'All their property has buildings on it — sell those first to trade it.'
          : 'No property to trade yet.'));
      return wrap;
    }

    const list = el('div', 'plist');
    tiles.forEach(i => {
      const t = BOARD[i];
      const chip = el('button', 'pchip' + (bag.tiles.includes(i) ? ' sel' : ''));
      const dot = el('span', 'dot');
      dot.style.background = GROUPS[t.group] ? GROUPS[t.group].color : '#9a8b7a';
      chip.append(dot, el('span', '', esc(t.name)), el('span', 'amt', `$${t.price}`));
      chip.onclick = () => {
        const k = bag.tiles.indexOf(i);
        if (k < 0) bag.tiles.push(i); else bag.tiles.splice(k, 1);
        chip.classList.toggle('sel');
        onChange();
      };
      list.appendChild(chip);
    });
    wrap.appendChild(list);
    return wrap;
  }

  function buildStep() {
    body.innerHTML = '';
    const them = Engine.P(S, target);
    const mine = Engine.P(S, me);

    const back = el('button', 'linkbtn', '← change player');
    back.onclick = pickStep;
    body.appendChild(back);

    const avatar = avatarNode;

    const cols = el('div', 'tradecols');
    const mk = (p, cls, verb) => {
      const c = el('div', 'tradeside ' + cls);
      const head = el('div', 'tshead');
      head.append(avatar(p), el('span', 'tsname', esc(p.name)), el('span', 'tsverb', verb));
      c.appendChild(head);
      c.appendChild(el('div', 'tscash', `has $${p.cash}`));
      return c;
    };
    const giveCol = mk(mine, 'give', 'gives');
    const getCol = mk(them, 'get', 'gives');
    cols.append(giveCol, getCol);
    body.appendChild(cols);

    const summary = el('div', 'tsum');
    let sendBtn;
    const refresh = () => {
      summary.innerHTML =
        `<div class="tsline"><span class="tclabel give">out</span> ${bagHTML(give)}</div>` +
        `<div class="tsline"><span class="tclabel get">in</span> ${bagHTML(want)}</div>`;
      const empty = !give.cash && !want.cash && !give.tiles.length && !want.tiles.length;
      sendBtn.disabled = empty;
      sendBtn.textContent = empty ? 'Add something to offer' : `➤ Send to ${them.name}`;
    };

    giveCol.appendChild(assetPicker(me, give, () => refresh()));
    getCol.appendChild(assetPicker(target, want, () => refresh()));

    const note = el('input');
    note.type = 'text'; note.maxLength = 120;
    note.placeholder = 'Add a note — e.g. "lifetime pass on Germany"';
    note.value = body.dataset.note;
    note.oninput = () => body.dataset.note = note.value;
    body.append(note, summary);

    sendBtn = el('button', 'btn primary wide');
    sendBtn.style.marginTop = '12px';
    sendBtn.onclick = () => {
      act({ type: 'proposeTrade', to: target, note: body.dataset.note, give, want });
      closeModal();
      toast('Offer sent — everyone can see it');
    };
    body.appendChild(sendBtn);
    refresh();
    modalTitle('Create a trade', `Public offer. Only ${esc(them.name)} can accept or decline it.`);
  }

  modal('Create a trade', '', body, true);
  if (target) buildStep(); else pickStep();
}

function modalTitle(title, sub) {
  const m = $('#overlay .modal'); if (!m) return;
  m.querySelector('h2').textContent = title;
  let s = m.querySelector('.sub');
  if (!s) { s = el('div', 'sub'); m.querySelector('h2').after(s); }
  s.innerHTML = sub;
}

/* One public card per live offer. Only the receiver gets the answer buttons. */
function tradeCard(t) {
  const from = Engine.P(S, t.from), to = Engine.P(S, t.to);
  const wrap = el('div', 'tradecard');
  const acting = actorId();

  wrap.appendChild(el('div', 'tchead', `
    <span class="ltag"><i style="background:${from.color}"></i>${esc(from.name)}</span>
    <span class="tarrow">→</span>
    <span class="ltag"><i style="background:${to.color}"></i>${esc(to.name)}</span>`));

  wrap.appendChild(el('div', 'tcbody', `
    <div class="tcline"><span class="tclabel give">${esc(from.name)} gives</span> ${bagHTML(t.give)}</div>
    <div class="tcline"><span class="tclabel get">${esc(to.name)} gives</span> ${bagHTML(t.want)}</div>
    ${t.note ? `<div class="tcnote">“${esc(t.note)}”</div>` : ''}`));

  const foot = el('div', 'tcfoot');
  // hot-seat: one screen, so the answer buttons are always reachable and are
  // labelled with the name of whoever is meant to press them.
  const canAnswer = LOCAL_ALL || acting === t.to;
  const canWithdraw = LOCAL_ALL || acting === t.from;

  if (canAnswer) {
    // deliberately asymmetric: accepting costs two clicks, declining one
    const yes = el('button', 'btn good');
    const yesLabel = LOCAL_ALL ? `✓ ${to.name} accepts` : '✓ Accept';
    yes.textContent = yesLabel;
    let armed = false, timer = null;
    yes.onclick = () => {
      if (!armed) {
        armed = true;
        yes.textContent = 'Tap again to confirm';
        yes.classList.add('arming');
        timer = setTimeout(() => { armed = false; yes.textContent = yesLabel; yes.classList.remove('arming'); }, 4000);
        return;
      }
      clearTimeout(timer);
      act({ type: 'respondTrade', id: t.id, accept: true }, t.to);
    };
    const no = el('button', 'btn bad');
    no.textContent = LOCAL_ALL ? `✕ ${to.name} declines` : '✕ Decline';
    no.onclick = () => act({ type: 'respondTrade', id: t.id, accept: false }, t.to);
    foot.append(yes, no);
  }
  if (canWithdraw && !canAnswer) {
    const c = el('button', 'btn');
    c.textContent = 'Withdraw offer';
    c.onclick = () => act({ type: 'cancelTrade', id: t.id }, t.from);
    foot.appendChild(c);
  }
  if (!canAnswer && !canWithdraw) {
    foot.appendChild(el('div', 'pmeta', `Waiting for ${esc(to.name)} to answer…`));
  }
  wrap.appendChild(foot);
  return wrap;
}

/* ---------- card popup ---------- */
let cardEl = null, cardShownAt = 0, cardTimer = null;
function renderCardPopup() {
  const c = S.cardShow;
  if (!c) { if (cardEl) { cardEl.remove(); cardEl = null; } return; }
  if (c.at === cardShownAt) return;              // already on screen
  cardShownAt = c.at;
  Sfx.card();
  if (cardEl) cardEl.remove();
  cardEl = el('div', 'cardpop ' + c.deckKind, esc(c.text));
  const x = el('button', 'x', '✕');
  x.onclick = () => { cardEl.remove(); cardEl = null; };
  cardEl.appendChild(x);
  document.body.appendChild(cardEl);
  clearTimeout(cardTimer);
  cardTimer = setTimeout(() => { if (cardEl) { cardEl.remove(); cardEl = null; } }, 4500);
}

function toast(msg) {
  const t = el('div', 'toast', esc(msg));
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1800);
}

/* ============================================================
   LOBBY
   ============================================================ */

function renderLobby() {
  let lob = $('#lobby');
  if (!lob) { lob = el('div'); lob.id = 'lobby'; document.body.appendChild(lob); }
  const takenColors = S.players.map(p => p.color);
