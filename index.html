  const me = MY_ID ? Engine.P(S, MY_ID) : null;

  lob.innerHTML = '';
  const main = el('div', 'lmain');
  main.appendChild(el('h1', '', 'MO<span>GUL</span>'));

  // A guest arriving on an invite link picks a name before connecting.
  const urlCode = Net.codeFromURL();
  if (urlCode && !net) {
    const j = el('div', 'card joinbox');
    j.appendChild(el('h3', '', `Join room ${esc(urlCode.slice(0, 5))}`));
    const jn = el('input'); jn.type = 'text'; jn.maxLength = 14;
    jn.value = localStorage.getItem('mogul.name') || '';
    jn.placeholder = 'Your name';
    const go = el('button', 'btn primary wide', 'Join ➜');
    go.style.marginTop = '10px';
    go.onclick = () => {
      const nm = (jn.value || 'Player').slice(0, 14);
      localStorage.setItem('mogul.name', nm);
      Net.join(urlCode, nm);
    };
    jn.onkeydown = (e) => { if (e.key === 'Enter') go.click(); };
    j.append(jn, go);
    if (Net.status === 'error') j.appendChild(el('div', 'neterr', esc(Net.error)));
    const solo = el('button', 'linkbtn', 'or play on this screen instead');
    solo.onclick = () => { history.replaceState(null, '', location.pathname); renderLobby(); };
    j.appendChild(solo);
    main.appendChild(j);
    lob.appendChild(main);
    lob.appendChild(settingsColumn(true));
    return;
  }

  main.appendChild(connectionPanel());

  // Until the host's state arrives, the seats and settings on this screen are
  // this browser's own defaults — showing them would be a lie.
  if (net && net.mode === 'guest' && Net.status !== 'open') {
    lob.appendChild(main);
    return;
  }
  main.appendChild(el('div', 'pmeta', 'Select your player appearance'));

  const sws = el('div', 'swatches');
  PLAYER_COLORS.forEach(c => {
    const taken = takenColors.includes(c) && (!me || me.color !== c);
    const shape = me ? (me.shape || 'blob') : 'blob';
    const b = el('button', 'sw' + (me && me.color === c ? ' sel' : '') + (taken ? ' taken' : ''),
      SHAPE_ICONS[shape](c));
    b.style.color = c;
    b.onclick = () => {
      if (!me) return;
      if (net && net.mode === 'guest') { net.send({ type: 'rename', color: c }); return; }
      me.color = c; renderLobby();
      if (net && net.mode === 'host') net.broadcast();
    };
    sws.appendChild(b);
  });
  main.appendChild(sws);

  main.appendChild(el('div', 'pmeta', 'Pick a shape'));
  const shapes = el('div', 'shapes');
  SHAPES.forEach(sh => {
    const cur = me ? (me.shape || 'blob') : 'blob';
    const b = el('button', 'shapebtn' + (cur === sh ? ' sel' : ''),
      SHAPE_ICONS[sh](me ? me.color : PLAYER_COLORS[3]));
    b.title = sh;
    b.onclick = () => {
      if (!me) return;
      if (net && net.mode === 'guest') { net.send({ type: 'rename', shape: sh }); return; }
      me.shape = sh;
      renderLobby();
      if (net && net.mode === 'host') net.broadcast();
    };
    shapes.appendChild(b);
  });
  main.appendChild(shapes);

  const nameBox = el('div'); nameBox.style.width = '260px';
  const inp = el('input'); inp.type = 'text'; inp.maxLength = 14;
  inp.value = me ? me.name : '';
  inp.placeholder = 'Your name';
  inp.oninput = () => {
    if (!me) return;
    me.name = inp.value.slice(0, 14) || 'Player';
    localStorage.setItem('mogul.name', me.name);
    clearTimeout(inp._t);
    inp._t = setTimeout(() => {
      if (net && net.mode === 'guest') net.send({ type: 'rename', name: me.name });
      else if (net && net.mode === 'host') net.broadcast();
    }, 400);
  };
  nameBox.appendChild(inp);
  main.appendChild(nameBox);

  const seats = el('div', 'card'); seats.style.width = '300px';
  seats.appendChild(el('h3', '', `Players ${S.players.length}/${S.settings.maxPlayers}`));
  S.players.forEach((p, k) => {
    const row = el('div', 'prow');
    const av = el('div', 'pav', '<div class="eye"></div><div class="eye"></div>'); av.style.background = p.color;
    row.append(av, el('div', 'pname', `${esc(p.name)}${k === 0 ? ' 👑' : ''}`));
    const badge = teamBadge(p.id);
    if (badge) row.appendChild(badge);
    if (k > 0 && !net) {
      const rm = el('button', 'mini bad', '✕'); rm.onclick = () => { S.players.splice(k, 1); renderLobby(); };
      row.appendChild(rm);
    }
    seats.appendChild(row);
  });
  const isHost = !net || (S.players[0] && S.players[0].id === MY_ID);
  const addRow = el('div'); addRow.style.cssText = 'display:flex;gap:8px;margin-top:8px';
  const addP = el('button', 'btn wide', '+ Add friend');
  addP.onclick = () => {
    const free = PLAYER_COLORS.find(c => !S.players.map(x => x.color).includes(c));
    Engine.addPlayer(S, { name: 'Player ' + (S.players.length + 1), color: free });
    renderLobby();
  };
  if (net) addP.style.display = 'none';   // online seats arrive over the socket
  addRow.append(addP);
  seats.appendChild(addRow);
  main.appendChild(seats);

  if (S.settings.teams) main.appendChild(teamsPanel());

  const start = el('button', 'btn primary', 'Start game ➜');
  start.style.padding = '13px 28px';
  start.disabled = S.players.length < 2 || !isHost;
  if (net && !isHost) start.textContent = 'Waiting for the host…';
  start.onclick = () => {
    act({ type: 'start' }, S.players[0].id);
    lob.remove();
    render();
  };
  main.appendChild(start);
  lob.appendChild(main);

  lob.appendChild(settingsColumn(!!net && !isHost));
}

/* Alliances are formed here and nowhere else: once the game starts the
   engine refuses every team action, so the lobby is the whole negotiation. */
function teamsPanel() {
  const card = el('div', 'card teambox'); card.style.width = '300px';
  card.appendChild(el('h3', '', 'Teams'));
  card.appendChild(el('div', 'pmeta',
    'No rent between teammates, property counts together, and the last team standing wins.'));

  const me = MY_ID ? Engine.P(S, MY_ID) : S.players[0];
  const hotSeat = !net;
  const send = (action, who) => {
    if (net && net.mode === 'guest') net.send(action);
    else { act(action, who || (me ? me.id : null)); renderLobby(); }
  };

  S.teams.forEach(t => {
    const mine = me && me.team === t.id;
    const row = el('div', 'teamcard' + (mine ? ' mine' : ''));
    row.style.setProperty('--tcol', t.color);
    row.appendChild(el('div', 'temoji', t.emoji));

    const mid = el('div', ''); mid.style.flex = '1'; mid.style.minWidth = '0';
    if (mine) {
      const inp = el('input');
      inp.type = 'text'; inp.maxLength = 16; inp.value = t.name;
      inp.oninput = () => {
        clearTimeout(inp._t);
        inp._t = setTimeout(() => send({ type: 'renameTeam', team: t.id, name: inp.value }), 400);
      };
      mid.appendChild(inp);
    } else {
      mid.appendChild(el('div', 'tname', esc(t.name)));
    }
    const members = el('div', 'tmembers');
    S.players.filter(p => p.team === t.id).forEach(p => {
      const m = el('span', 'tmember', `<i style="background:${p.color}"></i>${esc(p.name)}`);
      if (hotSeat) {
        const x = el('button', 'mini bad', '✕');
        x.style.cssText = 'padding:0 4px;font-size:9px;line-height:1.4';
        x.onclick = () => { Sfx.click(); send({ type: 'leaveTeam' }, p.id); };
        m.appendChild(x);
      }
      members.appendChild(m);
    });
    if (!S.players.some(p => p.team === t.id)) members.appendChild(el('span', 'tmember', 'empty'));
    mid.appendChild(members);
    row.appendChild(mid);

    if (!hotSeat) {
      const btn = el('button', 'mini' + (mine ? ' bad' : ''), mine ? 'Leave' : 'Join');
      btn.onclick = () => { Sfx.click(); send(mine ? { type: 'leaveTeam' } : { type: 'joinTeam', team: t.id }); };
      row.appendChild(btn);
    }
    card.appendChild(row);

    // on one screen, seats are handed to a team rather than joining one
    if (hotSeat) {
      const free = S.players.filter(p => p.team !== t.id);
      if (free.length) {
        const pick = el('div', 'tmembers');
        pick.style.margin = '0 0 8px 2px';
        free.forEach(p => {
          const b = el('button', 'mini', `+ ${esc(p.name)}`);
          b.onclick = () => { Sfx.click(); send({ type: 'joinTeam', team: t.id }, p.id); };
          pick.appendChild(b);
        });
        card.appendChild(pick);
      }
    }

    if (mine) {
      const pick = el('div', 'emojipick');
      TEAM_EMOJI.forEach(e => {
        const taken = S.teams.some(x => x.id !== t.id && x.emoji === e);
        const b = el('button', t.emoji === e ? 'sel' : '', e);
        b.disabled = taken;
        b.style.opacity = taken ? .3 : 1;
        b.onclick = () => send({ type: 'renameTeam', team: t.id, emoji: e });
        pick.appendChild(b);
      });
      card.appendChild(pick);
    }
  });

  const add = el('button', 'btn wide', '+ Create a team');
  add.style.marginTop = '4px';
  add.onclick = () => {
    Sfx.click();
    const starter = hotSeat ? (S.players.find(p => !p.team) || S.players[0]) : me;
    send({ type: 'createTeam' }, starter ? starter.id : null);
  };
  card.appendChild(add);

  const solo = S.players.filter(p => !p.team);
  if (solo.length) {
    card.appendChild(el('div', 'pmeta',
      `Playing alone: ${solo.map(p => esc(p.name)).join(', ')}. A lone wolf is a side of its own.`));
  }
  return card;
}

function connectionPanel() {
  const box = el('div', 'card netbox');

  if (!net) {
    const relay = Net.relayURL();
    box.appendChild(el('div', 'pmeta',
      relay ? 'Your own relay server is configured — rooms will use it.'
            : 'You get a link. Your friends click it. Nothing to install, and no setup on anyone\'s side.'));

    const b = el('button', 'btn primary wide', '🌐 Create an online room');
    b.style.marginTop = '8px';
    b.onclick = () => { b.disabled = true; b.textContent = 'Opening…'; Net.host(); };
    box.appendChild(b);

    if (Net.status === 'error') {
      box.appendChild(el('div', 'neterr', esc(Net.error)));
      const again = el('button', 'btn wide', '↻ Try again');
      again.onclick = () => Net.retry();
      box.appendChild(again);
      box.appendChild(relayField());
    }
    return box;
  }

  if (net.mode === 'host') {
    const how = net.transport === 'relay' ? 'your relay' : net.transport === 'p2p' ? 'peer-to-peer' : 'shared link';
    box.appendChild(el('h3', '', `Room ${esc(Net.short())} · ${how}`));
    const link = Net.inviteLink();
    const row = el('div', 'linkrow');
    const inp = el('input'); inp.type = 'text'; inp.readOnly = true; inp.value = link;
    inp.onclick = () => inp.select();
    const copy = el('button', 'btn primary', 'Copy');
    copy.onclick = async () => {
      try { await navigator.clipboard.writeText(link); } catch { inp.select(); }
      copy.textContent = 'Copied ✓';
      setTimeout(() => copy.textContent = 'Copy', 1600);
    };
    row.append(inp, copy);
    const peers = Net.peerCount ? Net.peerCount() : 0;
    box.append(row, el('div', 'pmeta',
      `Send this to your friends. Keep this tab open — it runs the game.<br><b>${peers}</b> guest${peers === 1 ? '' : 's'} connected.`));
    return box;
  }

  box.appendChild(el('h3', '', `Room ${esc(Net.short())}`));
  if (Net.status === 'open') {
    box.appendChild(el('div', 'pmeta', 'Connected. Waiting for the host to start.'));
    return box;
  }
  if (Net.status === 'error') {
    box.appendChild(el('div', 'neterr', esc(Net.error)));
    const again = el('button', 'btn primary wide', '↻ Try again');
    again.style.marginTop = '10px';
    again.onclick = () => Net.retry();
    box.appendChild(again);
    if (net.transport !== 'channel') {
      const viaChannel = el('button', 'btn wide', '🛟 Join over the shared link instead');
      viaChannel.onclick = () => Net.retry('channel');
      box.appendChild(viaChannel);
    }
    if (Net.relayURL() && net.transport !== 'relay') {
      const viaRelay = el('button', 'btn wide', '🛟 Use my relay instead');
      viaRelay.onclick = () => Net.retry('relay');
      box.appendChild(viaRelay);
    }
    box.appendChild(diagButton());
    box.appendChild(relayField());
    return box;
  }
  box.appendChild(el('div', 'pmeta connecting',
    Net.status === 'signalling' ? 'Finding the room…' : 'Connecting…'));
  return box;
}

function diagButton() {
  const diag = el('button', 'linkbtn', 'Run a connection test');
  diag.onclick = async () => {
    diag.textContent = 'Testing…';
    const d = await Net.diagnose();
    diag.textContent = `WebRTC ${d.webrtc ? 'yes' : 'no'} · local ${d.host} · public ${d.srflx}${d.error ? ' · ' + d.error : ''}`;
  };
  return diag;
}

/* A relay address makes the game work on networks that kill WebRTC. */
function relayField() {
  const wrap = el('div', 'relaybox');
  const toggle = el('button', 'linkbtn', Net.relayURL() ? '⚙ Relay server (set)' : '⚙ Use a relay server');
  const body = el('div', 'relaybody');
  body.style.display = 'none';
  toggle.onclick = () => { body.style.display = body.style.display === 'none' ? 'block' : 'none'; };

  const inp = el('input');
  inp.type = 'text';
  inp.placeholder = 'wss://your-relay.onrender.com';
  inp.value = Net.relayURL();
  const save = el('button', 'btn wide', 'Save relay');
  save.style.marginTop = '8px';
  save.onclick = () => {
    Net.setRelayURL(inp.value);
    toast(inp.value ? 'Relay saved' : 'Relay cleared');
    renderLobby();
  };
  body.append(
    el('div', 'pmeta', 'Optional. Rooms already work without this. Paste your own relay server only if you would rather not share a public broker — see relay/ in the repo.'),
    inp, save);
  wrap.append(toggle, body);
  return wrap;
}

function settingsColumn(readOnly) {
  const sideCol = el('div', 'lside');
  if (readOnly) sideCol.appendChild(el('div', 'pmeta', 'Only the host can change these.'));
  let section = '';
  SETTINGS_META.forEach(meta => {
    if (meta.section !== section) { section = meta.section; sideCol.appendChild(el('div', 'sechead', section)); }
    const row = el('div', 'setrow');
    const txt = el('div', 'txt', `<b>${esc(meta.label)}</b><small>${esc(meta.desc)}</small>`);
    row.appendChild(txt);
    if (meta.type === 'select') {
      const sel = el('select');
      meta.options.forEach(o => {
        const op = el('option', '', meta.key === 'turnSeconds' ? (o === 0 ? 'Off' : o + 's') : String(o));
        op.value = o; if (S.settings[meta.key] === o) op.selected = true;
        sel.appendChild(op);
      });
      sel.disabled = !!readOnly;
      sel.onchange = () => {
        if (net && net.mode === 'guest') { net.send({ type: 'setting', key: meta.key, value: +sel.value }); return; }
        S.settings[meta.key] = +sel.value;
        if (meta.key === 'startingCash') S.players.forEach(p => p.cash = +sel.value);
        renderLobby();
        if (net && net.mode === 'host') net.broadcast();
      };
      row.appendChild(sel);
    } else {
      const tg = el('button', 'sw-toggle' + (S.settings[meta.key] ? ' on' : ''));
      tg.onclick = () => {
        if (readOnly) return;
        S.settings[meta.key] = !S.settings[meta.key];
        renderLobby();
        if (net && net.mode === 'host') net.broadcast();
      };
      row.appendChild(tg);
    }
    sideCol.appendChild(row);
  });
  return sideCol;
}

/* ============================================================
   RENDER + BOOT
   ============================================================ */

function render() {
  if (S.phase === 'lobby') { renderLobby(); return; }
  syncPieces();
  renderDice(false);
  renderHUD();
  renderCardPopup();
  const ov = $('#overlay');
  if (ov && ov.dataset.live) { /* keep open modals in sync elsewhere */ }
}

function boot() {
  S = Engine.createState();
  const saved = localStorage.getItem('mogul.name');
  Engine.addPlayer(S, { name: saved || 'You', color: PLAYER_COLORS[3] });
  MY_ID = S.players[0].id;
  Sfx.init();
  bindBoard(Board3D);
  bindBoard(Board2D);
  applyView();
  renderLobby();
  window.addEventListener('hashchange', () => { if (!net) renderLobby(); });
  window.addEventListener('beforeunload', () => {
    const me = Engine.P(S, MY_ID);
    if (me) localStorage.setItem('mogul.name', me.name);
  });
}
</script>
<script>/* ============================================================
   MOGUL — online play

   Two transports, one game logic. The host's browser is always the
   referee: guests send actions, the host applies them with the same
   engine and broadcasts the result.

     channel  The default. A room is a topic on a free public MQTT
              broker — plain WSS, so it works wherever a website does,
              and there is nothing to deploy or configure.
     p2p      WebRTC via PeerJS. Lower latency, but it dies wherever
              WebRTC is blocked — VPNs, proxies, some networks.
     relay    Your own WebSocket server (see relay/), if you would
              rather not share a public broker.

   None of the three is a referee: they carry bytes and never see a rule.
   ============================================================ */

const Net = (() => {
  const PREFIX = 'mogul-v1-';
  const CDN = 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
  const BROKER_TIMEOUT = 9000;    // waiting for the matchmaking service
  const CHANNEL_TIMEOUT = 14000;  // waiting for the actual connection

  const ICE = [
    { urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] },
    { urls: ['stun:stun2.l.google.com:19302', 'stun:stun3.l.google.com:19302'] },
    // { urls: 'turn:YOUR_HOST:3478', username: '...', credential: '...' },
  ];
  const PEER_OPTS = { debug: 0, config: { iceServers: ICE } };

  const api = {
    mode: null,        // 'host' | 'guest'
    transport: null,   // 'p2p' | 'relay'
    code: null,
    status: 'idle',    // idle | signalling | connecting | open | error
    error: '',
  };

  /* ---------- session state, shared by both transports ---------- */

  let send = null;          // (peerId|null, data) -> void
  let closeAll = () => {};
  const peers = new Set();  // host: connected guests
  const seatByPeer = new Map();
  let myName = 'Player';

  function setStatus(status, error) {
    api.status = status;
    api.error = error || '';
    if (typeof S !== 'undefined' && S && S.phase === 'lobby') renderLobby();
  }

  function relayURL() {
    const q = new URLSearchParams(location.search).get('relay');
    return q || localStorage.getItem('mogul.relay') || '';
  }
  api.relayURL = relayURL;
  api.setRelayURL = (u) => {
    if (u) localStorage.setItem('mogul.relay', u.trim());
    else localStorage.removeItem('mogul.relay');
  };

  /* ---------- host side: identical whatever the wire ---------- */

  function onGuestMessage(peerId, msg) {
    if (msg.t === 'hello') {
      const name = String(msg.name || 'Player').slice(0, 14);
      const existing = S.players.find(p => p.name === name);

      if (S.phase !== 'lobby') {
        if (!existing) return send(peerId, { t: 'refused', reason: 'The game already started.' });
        seatByPeer.set(peerId, existing.id);
        send(peerId, { t: 'you', id: existing.id });
        return broadcast();
      }
      if (existing) return send(peerId, { t: 'refused', reason: 'That name is already taken in this room.' });

      const taken = S.players.map(p => p.color);
      const color = PLAYER_COLORS.find(c => !taken.includes(c));
      if (!color || !Engine.addPlayer(S, { name, color })) {
        return send(peerId, { t: 'refused', reason: 'The room is full.' });
      }
      const seat = S.players[S.players.length - 1].id;
      seatByPeer.set(peerId, seat);
      send(peerId, { t: 'you', id: seat });
      renderLobby();
      return broadcast();
    }

    if (msg.t === 'action') {
      const seat = seatByPeer.get(peerId);
      if (!seat) return;
      Engine.applyAction(S, seat, msg.action);   // the host is the referee
      if (S.phase === 'lobby') renderLobby();
      else { const l = document.querySelector('#lobby'); if (l) l.remove(); render(); }
      broadcast();
    }
  }

  function onGuestGone(peerId) {
    peers.delete(peerId);
    const seat = seatByPeer.get(peerId);
    seatByPeer.delete(peerId);
    if (!seat) return;
    if (S.phase === 'lobby') {
      S.players = S.players.filter(p => p.id !== seat);
      renderLobby();
    } else {
      Engine.log(S, 'A player lost connection — they can rejoin with the same name');
      render();
    }
    broadcast();
  }

  function broadcast() {
    send(null, { t: 'state', state: S });
  }
  api.broadcast = broadcast;
  api.peerCount = () => peers.size;

  /* ---------- guest side ---------- */

  function onHostMessage(msg) {
    if (msg.t === 'you') MY_ID = msg.id;
    if (msg.t === 'refused') setStatus('error', msg.reason);
    if (msg.t === 'state') {
      S = msg.state;
      if (S.phase === 'lobby') renderLobby();
      else { const l = document.querySelector('#lobby'); if (l) l.remove(); render(); }
    }
  }

  api.send = (action) => send && send(null, { t: 'action', action });

  /* ============================================================
     transport: WebRTC (PeerJS)
     ============================================================ */

  function loadPeerJS() {
    if (window.Peer) return Promise.resolve();
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = CDN;
      s.onload = resolve;
      s.onerror = () => reject(new Error('Could not load the connection library. Are you online?'));
      document.head.appendChild(s);
    });
  }

  /* Twelve characters: the first five are the room's name, the rest keep the
     room unguessable — public brokers are shared, and a topic is public. */
  function makeCode() {
    const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    return Array.from({ length: 12 }, () => alphabet[Math.floor(Math.random() * alphabet.length)]).join('');
  }

  async function p2pHost(code) {
    await loadPeerJS();
    setStatus('signalling');
    const conns = new Map();

    const peer = new window.Peer(PREFIX + code, PEER_OPTS);
    closeAll = () => { try { peer.destroy(); } catch (e) {} };
    send = (to, data) => {
      if (to) { const c = conns.get(to); if (c && c.open) c.send(data); return; }
      conns.forEach(c => { if (c.open) c.send(data); });
    };

    const broker = setTimeout(() => {
      if (api.status === 'signalling') {
        setStatus('error', 'The matchmaking service did not answer. Try again — rooms normally open over the shared link instead.');
      }
    }, BROKER_TIMEOUT);

    peer.on('open', () => {
      clearTimeout(broker);
      finishHost(code, 'p2p');
    });
    peer.on('error', (err) => {
      clearTimeout(broker);
      if (err.type === 'unavailable-id') { try { peer.destroy(); } catch (e) {} return p2pHost(makeCode()); }
      setStatus('error', friendly(err));
    });
    peer.on('connection', (conn) => {
      const id = conn.peer;
      conn.on('open', () => { conns.set(id, conn); peers.add(id); renderLobby(); });
      conn.on('data', (msg) => onGuestMessage(id, msg));
      conn.on('close', () => { conns.delete(id); onGuestGone(id); });
    });
  }

  async function p2pJoin(code, name) {
    await loadPeerJS();
    setStatus('signalling');
    const peer = new window.Peer(PEER_OPTS);
    let hostConn = null, settled = false;
    closeAll = () => { try { peer.destroy(); } catch (e) {} };

    const broker = setTimeout(() => {
      if (!settled && api.status === 'signalling') {
        setStatus('error', 'The matchmaking service did not answer. Try again, or join over the shared link instead.');
      }
    }, BROKER_TIMEOUT);

    const stall = setTimeout(async () => {
      if (settled) return;
      setStatus('error', await explainStall());
    }, CHANNEL_TIMEOUT);

    peer.on('error', (err) => { clearTimeout(broker); setStatus('error', friendly(err)); });

    peer.on('open', () => {
      clearTimeout(broker);
      setStatus('connecting');
      hostConn = peer.connect(PREFIX + code, { reliable: true });
      send = (_to, data) => { if (hostConn && hostConn.open) hostConn.send(data); };
      hostConn.on('open', () => {
        settled = true; clearTimeout(stall);
        finishGuest(code, 'p2p');
        send(null, { t: 'hello', name });
      });
      hostConn.on('data', onHostMessage);
      hostConn.on('close', () => { clearTimeout(stall); setStatus('error', 'The connection to the host dropped.'); });
      hostConn.on('error', () => { clearTimeout(stall); setStatus('error', 'The link to the host failed.'); });
    });
  }

  /* ============================================================
     transport: public channel (MQTT over WebSocket)

     Public brokers run these for anyone to use, so nobody deploys
     anything: a room is a topic, the host is still the referee.
     It is plain WSS, so it survives everything that kills WebRTC.

     Topics, all under the room key:
       <key>/open   retained "1" — proof the room exists
       <key>/host   guests -> host
       <key>/all    host -> everyone
       <key>/g/<id> host -> one guest
     ============================================================ */

  const CHANNELS = [
    { id: 'e', url: 'wss://broker.emqx.io:8084/mqtt' },
    { id: 'h', url: 'wss://broker.hivemq.com:8884/mqtt' },
  ];
  const CHUNK = 12000;          // brokers dislike huge frames, so payloads are split
  const OPEN_TIMEOUT = 3500;    // waiting for the room marker

  const te = new TextEncoder(), td = new TextDecoder();
  const rnd = (n) => Array.from({ length: n }, () => 'abcdefghijklmnopqrstuvwxyz0123456789'[Math.floor(Math.random() * 36)]).join('');

  /* --- MQTT 3.1.1, only the four packets this game needs --- */
  function vlen(n) { const o = []; do { let b = n % 128; n = Math.floor(n / 128); if (n > 0) b |= 128; o.push(b); } while (n > 0); return o; }
  function mstr(s) { const b = te.encode(s); return [b.length >> 8, b.length & 255, ...b]; }
  function mpk(type, flags, body) {
    const head = [(type << 4) | flags, ...vlen(body.length)];
    const out = new Uint8Array(head.length + body.length);
    out.set(head); out.set(body, head.length);
    return out;
  }
  function connectPkt(clientId, will) {
    let flags = 0x02;                                  // clean session
    const tail = [];
    if (will) { flags |= 0x04 | 0x20; tail.push(...mstr(will.topic), ...mstr(will.payload)); }
    return mpk(1, 0, [...mstr('MQTT'), 4, flags, 0x00, 0x3c, ...mstr(clientId), ...tail]);
  }
  const subPkt = (topics) => mpk(8, 2, [0, 1, ...topics.flatMap(t => [...mstr(t), 0])]);
  function pubPkt(topic, payload, retain) {
    const t = mstr(topic), p = te.encode(payload);
    const body = new Uint8Array(t.length + p.length);
    body.set(t); body.set(p, t.length);
    return mpk(3, retain ? 1 : 0, body);
  }

  /* A packet can span WebSocket frames, and one frame can hold several. */
  function mqttReader(onPacket) {
    let buf = new Uint8Array(0);
    return (chunk) => {
      const next = new Uint8Array(buf.length + chunk.length);
      next.set(buf); next.set(chunk, buf.length);
      buf = next;
      for (;;) {
        if (buf.length < 2) return;
        let mult = 1, len = 0, j = 1, b;
        do {
          if (j >= buf.length) return;                 // length field not all here yet
          b = buf[j++]; len += (b & 127) * mult; mult *= 128;
        } while (b & 128);
        if (buf.length < j + len) return;              // body still on the way
        const type = buf[0] >> 4, flags = buf[0] & 15, body = buf.subarray(j, j + len);
        if (type === 3) {
          const tl = (body[0] << 8) | body[1];
          let p = 2 + tl;
          if (flags & 6) p += 2;                       // QoS > 0 carries a packet id
          onPacket({ type, topic: td.decode(body.subarray(2, 2 + tl)), payload: td.decode(body.subarray(p)) });
        } else onPacket({ type });
        buf = buf.subarray(j + len);
      }
    };
  }

  function mqttClient(url, will) {
    return new Promise((resolve, reject) => {
      let ws;
      try { ws = new WebSocket(url, 'mqtt'); } catch (e) { return reject(new Error('This browser refused the connection.')); }
      ws.binaryType = 'arraybuffer';

      const handlers = [];
      const parts = new Map();          // message id -> chunks, so senders never interleave
      let ping = null, closed = false;
      const timer = setTimeout(() => { try { ws.close(); } catch (e) {} reject(new Error('timeout')); }, CHANNEL_TIMEOUT);

      const feed = mqttReader((p) => {
        if (p.type === 2) {             // CONNACK
          clearTimeout(timer);
          ping = setInterval(() => { if (!closed) try { ws.send(mpk(12, 0, [])); } catch (e) {} }, 30000);
          resolve({
            sub: (...topics) => ws.send(subPkt(topics)),
            pub: (topic, payload, retain) => {
              const id = rnd(6);
              if (payload.length <= CHUNK) return ws.send(pubPkt(topic, `${id}/0/1|${payload}`, retain));
              const n = Math.ceil(payload.length / CHUNK);
              for (let i = 0; i < n; i++) ws.send(pubPkt(topic, `${id}/${i}/${n}|` + payload.slice(i * CHUNK, (i + 1) * CHUNK), retain));
            },
            on: (fn) => handlers.push(fn),
            onclose: (fn) => { ws.addEventListener('close', fn); },
            close: () => { closed = true; clearInterval(ping); try { ws.close(); } catch (e) {} },
          });
          return;
        }
        if (p.type !== 3) return;
        const bar = p.payload.indexOf('|');
        if (bar < 0) return handlers.forEach(fn => fn(p.topic, p.payload));   // retained marker
        const [id, i, n] = p.payload.slice(0, bar).split('/');
        const rest = p.payload.slice(bar + 1);
        if (Number(n) === 1) return handlers.forEach(fn => fn(p.topic, rest));
        const acc = parts.get(id) || [];
        acc[Number(i)] = rest;
        parts.set(id, acc);
        if (acc.filter(x => x !== undefined).length === Number(n)) {
          parts.delete(id);
          handlers.forEach(fn => fn(p.topic, acc.join('')));
        }
      });

      ws.onopen = () => ws.send(connectPkt('mogul' + rnd(12), will));
      ws.onmessage = (e) => feed(new Uint8Array(e.data));
      ws.onerror = () => { clearTimeout(timer); reject(new Error('unreachable')); };
      ws.onclose = () => { closed = true; clearInterval(ping); };
    });
  }

  const frame = (obj) => rnd(6) + '/0/1|' + JSON.stringify(obj);   // pre-framed, for a last will

  /* The broker named by the link first, then the rest — each tried once. */
  const brokerOrder = (prefer) =>
    CHANNELS.filter(c => c.id === prefer).concat(CHANNELS.filter(c => c.id !== prefer));

  async function channelHost(key, prefer) {
    const list = brokerOrder(prefer);
    let last = null;
    for (const b of list) {
      try {
        setStatus('connecting');
        const c = await mqttClient(b.url, { topic: `mogul/${key}/open`, payload: '' });
        c.sub(`mogul/${key}/host`);
        c.pub(`mogul/${key}/open`, '1', true);

        closeAll = () => { try { c.pub(`mogul/${key}/open`, '', true); c.close(); } catch (e) {} };
        send = (to, data) => c.pub(to ? `mogul/${key}/g/${to}` : `mogul/${key}/all`, JSON.stringify(data));

        c.on((topic, payload) => {
          if (!topic.endsWith('/host')) return;
          let m; try { m = JSON.parse(payload); } catch (e) { return; }
          if (!m || !m.from) return;
          if (m.bye) return onGuestGone(m.from);
          if (m.msg && m.msg.t === 'hello' && !peers.has(m.from)) { peers.add(m.from); renderLobby(); }
          if (m.msg) onGuestMessage(m.from, m.msg);
        });
        c.onclose(() => { if (api.status === 'open') setStatus('error', 'The room connection dropped. Press "Try again" — your friends can rejoin with the same names.'); });

        return b.id;
      } catch (e) { last = e; }
    }
    throw new Error('No public channel answered' + (last ? ` (${last.message})` : '') + '. Check you are online, or try again.');
  }

  async function channelJoin(key, name, prefer) {
    const list = brokerOrder(prefer);
    let refused = null;
    for (const b of list) {
      let c;
      try {
        setStatus('connecting');
        const me = rnd(8);
        c = await mqttClient(b.url, { topic: `mogul/${key}/host`, payload: frame({ from: me, bye: true }) });

        const open = await new Promise((resolve) => {
          const t = setTimeout(() => resolve(false), OPEN_TIMEOUT);
          c.on((topic, payload) => {
            if (topic.endsWith('/open')) { clearTimeout(t); resolve(payload === '1'); }
          });
          c.sub(`mogul/${key}/open`, `mogul/${key}/all`, `mogul/${key}/g/${me}`);
        });
        if (!open) { c.close(); refused = new Error('No room with that code — the host may have closed the tab.'); continue; }

        closeAll = () => { try { c.pub(`mogul/${key}/host`, JSON.stringify({ from: me, bye: true })); c.close(); } catch (e) {} };
        send = (_to, data) => c.pub(`mogul/${key}/host`, JSON.stringify({ from: me, msg: data }));

        c.on((topic, payload) => {
          if (topic.endsWith('/open')) { if (payload === '') setStatus('error', 'The host closed the room.'); return; }
          let m; try { m = JSON.parse(payload); } catch (e) { return; }
          onHostMessage(m);
        });
        c.onclose(() => { if (api.status === 'open') setStatus('error', 'The connection dropped. Reload the link with the same name to get your seat back.'); });

        send(null, { t: 'hello', name });
        return b.id;
      } catch (e) { try { c && c.close(); } catch (e2) {} refused = e; }
    }
    throw refused || new Error('No public channel answered. Check you are online, or try again.');
  }

  /* ============================================================
     transport: WebSocket relay (optional, for a server you own)
     ============================================================ */

  function relayConnect(url, code, role, name) {
    return new Promise((resolve, reject) => {
      let ws;
      try { ws = new WebSocket(url); } catch (e) { return reject(new Error('That relay address is not valid.')); }
      const timer = setTimeout(() => { try { ws.close(); } catch (e) {} reject(new Error('The relay server did not answer.')); }, CHANNEL_TIMEOUT);

      ws.onopen = () => ws.send(JSON.stringify({ t: 'join', room: code, role }));
      ws.onerror = () => { clearTimeout(timer); reject(new Error('Could not reach the relay server.')); };
      ws.onclose = () => { if (api.status === 'open') setStatus('error', 'The relay connection dropped.'); };

      ws.onmessage = (ev) => {
        let msg; try { msg = JSON.parse(ev.data); } catch (e) { return; }

        if (msg.t === 'welcome') {
          clearTimeout(timer);
          closeAll = () => { try { ws.close(); } catch (e) {} };
          if (role === 'host') {
            send = (to, data) => ws.send(JSON.stringify({ t: to ? 'to' : 'all', id: to, data }));
            resolve();
          } else {
            if (!msg.host) { try { ws.close(); } catch (e) {} return reject(new Error('No room with that code on this relay.')); }
            send = (_to, data) => ws.send(JSON.stringify({ t: 'to', id: msg.host, data }));
            resolve();
            send(null, { t: 'hello', name });
          }
          return;
        }
        if (msg.t === 'peer' && role === 'host') { peers.add(msg.id); renderLobby(); return; }
        if (msg.t === 'gone') { if (role === 'host') onGuestGone(msg.id); else setStatus('error', 'The host left the room.'); return; }
        if (msg.t === 'from') {
          if (role === 'host') onGuestMessage(msg.id, msg.data);
          else onHostMessage(msg.data);
        }
      };
    });
  }

  /* ---------- entry points ---------- */

  let broker = null;   // which public channel this room lives on

  function brokerFromURL() {
    return new URLSearchParams(location.search).get('b') || null;
  }

  function query(transport) {
    if (transport === 'relay') return '?relay=' + encodeURIComponent(relayURL());
    if (transport === 'channel' && broker) return '?b=' + broker;
    return '';
  }

  function finishHost(code, transport) {
    api.mode = 'host'; api.transport = transport; api.code = code;
    net = api; LOCAL_ALL = false;
    history.replaceState(null, '', location.pathname + query(transport) + '#' + code);
    setStatus('open');
  }

  function finishGuest(code, transport) {
    api.mode = 'guest'; api.transport = transport; api.code = code;
    net = api; LOCAL_ALL = false;
    setStatus('open');
  }

  /* Default is the public channel: it needs no setup and no WebRTC. */
  api.host = async function (preferred) {
    const code = makeCode();
    const relay = relayURL();
    const want = preferred || (relay ? 'relay' : 'channel');
    try {
      if (want === 'relay' && relay) {
        setStatus('connecting');
        await relayConnect(relay, code, 'host');
        finishHost(code, 'relay');
      } else if (want === 'p2p') {
        await p2pHost(code);
      } else {
        try {
          broker = await channelHost(code, brokerFromURL());
          finishHost(code, 'channel');
        } catch (e) {
          await p2pHost(code);          // last resort if no broker answered
        }
      }
    } catch (e) {
      setStatus('error', e.message || String(e));
    }
  };

  api.join = async function (code, name, preferred) {
    myName = name;
    const relay = relayURL();
    const want = preferred || (relay ? 'relay' : 'channel');
    try {
      if (want === 'relay' && relay) {
        setStatus('connecting');
        await relayConnect(relay, code, 'guest', name);
        finishGuest(code, 'relay');
      } else if (want === 'p2p') {
        await p2pJoin(code, name);
      } else {
        broker = await channelJoin(code, name, brokerFromURL());
        finishGuest(code, 'channel');
      }
    } catch (e) {
      setStatus('error', e.message || String(e));
    }
  };

  api.retry = function (preferred) {
    const code = api.code || (location.hash || '').replace('#', '').toUpperCase();
    const mode = api.mode;
    try { closeAll(); } catch (e) {}
    peers.clear(); seatByPeer.clear();
    send = null; api.mode = null; api.transport = null;
    net = null; LOCAL_ALL = true;
    return mode === 'host' ? api.host(preferred) : api.join(code, myName, preferred);
  };

  /* ---------- diagnosis ---------- */

  api.diagnose = function () {
    return new Promise((resolve) => {
      const out = { webrtc: false, host: 0, srflx: 0, relay: 0, error: '' };
      const RTC = window.RTCPeerConnection || window.webkitRTCPeerConnection;
      if (!RTC) return resolve(out);
      out.webrtc = true;
      let pc;
      try {
        pc = new RTC({ iceServers: ICE });
        pc.createDataChannel('probe');
      } catch (e) {
        out.error = e.message || String(e);
        return resolve(out);
      }
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        try { pc.close(); } catch (e) {}
        resolve(out);
      };
      pc.onicecandidate = (e) => {
        if (!e.candidate) return finish();
        const kind = (String(e.candidate.candidate).match(/ typ (\w+)/) || [])[1];
        if (kind === 'host') out.host++;
        else if (kind === 'srflx') out.srflx++;
        else if (kind === 'relay') out.relay++;
      };
      setTimeout(finish, 6000);
      pc.createOffer().then(o => pc.setLocalDescription(o))
        .catch(e => { out.error = e.message || String(e); finish(); });
    });
  };

  async function explainStall() {
    const d = await api.diagnose();
    const escape = ' Press "Join over the shared link instead" — that route needs no WebRTC at all.';
    if (!d.webrtc) return 'This browser has no WebRTC support.' + escape;
    if (d.error) return `WebRTC refused to start (${d.error}).` + escape;
    if (d.host === 0) {
      return 'The browser produced no network candidates at all, so WebRTC is blocked. ' +
             'In Opera, check Settings → Privacy → WebRTC and set IP handling back to default; ' +
             'the built-in VPN leaves that switch flipped even after you turn it off.' + escape;
    }
    if (d.srflx === 0) {
      return 'Only local candidates were found: STUN is unreachable, usually a VPN or firewall. ' +
             'Players on the same wifi may connect, others will not.' + escape;
    }
    return 'The network looks fine here, so the room is probably closed — check the host still has the tab open.' + escape;
  }

  function friendly(err) {
    if (err.type === 'peer-unavailable') return 'No room with that code. Check the link, or ask the host to reopen the room.';
    if (err.type === 'network' || err.type === 'server-error') return 'The matchmaking service is unreachable. Join over the shared link instead.';
    if (err.type === 'browser-incompatible') return 'This browser does not support peer-to-peer play.';
    return err.message || 'Connection failed.';
  }

  api.inviteLink = () => location.origin + location.pathname + query(api.transport) + '#' + api.code;
  api.codeFromURL = () => (location.hash || '').replace('#', '').toUpperCase().slice(0, 12) || null;
  api.short = () => String(api.code || '').slice(0, 5);   // the half worth reading aloud

  return api;
})();
</script>

/* Console handle: MOGUL.S is the live state, MOGUL.act(...) fires an action. */
window.MOGUL = {
  get S(){return S}, set S(v){S=v},
  get MY_ID(){return MY_ID}, get LOCAL_ALL(){return LOCAL_ALL},
  Engine, Net, Board3D, Board2D, act,
  get Board(){return Board}, get VIEW(){return VIEW}, setView,
  applyView, is3D,
  syncPieces, render, renderHUD, actorId, openTrade, closeModal, focusProperty, renderMyProperties,
  BOARD, GROUPS, PLAYER_COLORS, SETTINGS_META, Sfx,
};
boot();
</script>
